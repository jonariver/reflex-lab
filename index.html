<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>REFLEX LAB — Test dein Nervensystem</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C2523">
<link rel="icon" href="icons/icon-32.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Reflex Lab">
<link rel="stylesheet" href="styles.css">
<style>
  /* ---------- Leaderboard ---------- */
  .leaderboard-card{
    width: 100%;
    max-width: 260px;
    background: #fff;
    color: var(--ink);
    padding: 18px 18px 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    margin-top: 14px;
    text-align: left;
  }
  .leaderboard-title{
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    text-align: center;
    margin-bottom: 10px;
  }
  .leaderboard-list{
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 12px;
  }
  .leaderboard-row{
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 12.5px;
  }
  .leaderboard-row span:first-child{
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 180px;
  }
  .leaderboard-empty{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
  }
  .leaderboard-form{
    display: flex;
    gap: 6px;
    border-top: 1px dashed #c9c9c9;
    padding-top: 12px;
  }
  .nickname-input{
    flex: 1;
    min-width: 0;
    font-family: var(--font-body);
    font-size: 13px;
    padding: 8px 10px;
    border: 1px solid var(--paper-dim);
    border-radius: 8px;
    background: var(--paper);
    color: var(--ink);
  }
  .leaderboard-form button{
    padding: 8px 14px;
    font-size: 13px;
    white-space: nowrap;
  }

  /* ---------- Sparkline ---------- */
  .sparkline-wrap{
    margin-top: 12px;
    text-align: center;
  }
  .sparkline-label{
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  /* ---------- Achievement badges ---------- */
  .achievements{
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin: 12px 0 0;
  }
  .achievement-badge{
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 700;
    color: var(--ink);
    background: var(--yellow);
    padding: 5px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }

  /* ---------- Streak badge ---------- */
  .streak-badge{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
    background: var(--paper-dim);
    padding: 6px 14px;
    border-radius: 20px;
    margin-bottom: 18px;
  }

  /* ---------- Text link ---------- */
  .text-link{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  /* ---------- Challenge stats ---------- */
  .challenge-stats{
    font-family: var(--font-mono);
    font-size: 12px;
    width: 100%;
    max-width: 220px;
    margin: -12px 0 24px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .challenge-stats .row{
    display:flex; justify-content: space-between;
    color: var(--ink-soft);
  }
  .challenge-stats .row span:last-child{
    color: var(--ink);
    font-weight: 700;
  }

  /* ---------- Difficulty picker ---------- */
  .diff-picker{
    display:flex;
    gap: 8px;
    margin: 0 0 22px;
  }
  .diff-chip{
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 20px;
    background: transparent;
    color: var(--ink-soft);
    box-shadow: 0 0 0 1.5px var(--paper-dim) inset;
    transition: none;
  }
  .diff-chip.active{
    background: var(--ink);
    color: var(--paper);
    box-shadow: none;
  }

  /* ---------- Progress dots ---------- */
  #progress{
    position:absolute;
    top: 16px; left: 0; right:0;
    display:flex;
    gap: 6px;
    justify-content:center;
    z-index: 5;
  }
  .prog-dot{
    width: 22px; height: 4px; border-radius: 2px;
    background: var(--paper-dim);
  }
  .prog-dot.done{ background: var(--teal); }
  .prog-dot.active{ background: var(--signal); }

  /* ---------- Reaction test ---------- */
  .reaction-zone{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    transition: background 0.15s ease;
  }
  .reaction-zone.wait{ background: var(--signal-dim); }
  .reaction-zone.go{ background: #C9E4B8; }
  .reaction-zone.early{ background: var(--signal); }
  .reaction-word{
    font-family: var(--font-display);
    font-size: 28px;
    color: var(--ink);
  }
  .reaction-hint{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 8px;
  }

  /* ---------- Timing test ---------- */
  .timing-track{
    position: relative;
    width: 100%;
    height: 54px;
    background: var(--paper-dim);
    border-radius: 8px;
    margin: 18px 0 30px;
    overflow: hidden;
  }
  .timing-target{
    position: absolute;
    top: 0; bottom: 0;
    width: 18%;
    left: 41%;
    background: rgba(63,109,102,0.25);
    border-left: 2px dashed var(--teal);
    border-right: 2px dashed var(--teal);
  }
  .timing-needle{
    position: absolute;
    top: 0; bottom: 0;
    width: 4px;
    background: var(--signal);
  }

  /* ---------- Memory test ---------- */
  .memory-grid{
    display:grid;
    grid-template-columns: repeat(3, 64px);
    gap: 10px;
    margin: 10px 0 24px;
  }
  .memory-tile{
    width: 64px; height: 64px;
    background: var(--paper-dim);
    border-radius: 12px;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .memory-tile.flash{ background: var(--yellow); }
  .memory-tile.picked{ background: var(--teal); }
  .memory-tile:active{ transform: scale(0.94); }

  /* ---------- Precision test ---------- */
  .precision-field{
    position: absolute; inset: 0;
  }
  .precision-target{
    position: absolute;
    border-radius: 50%;
    background: var(--signal);
    box-shadow: 0 0 0 6px rgba(226,65,44,0.15);
  }

  /* ---------- Result receipt ---------- */
  .receipt{
    width: 100%;
    max-width: 260px;
    background: #fff;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 12.5px;
    line-height: 1.7;
    padding: 20px 18px 26px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    position: relative;
  }
  .receipt::after{
    content: "";
    position: absolute;
    left:0; right:0; bottom: -9px;
    height: 18px;
    background:
      linear-gradient(-45deg, #fff 8px, transparent 0),
      linear-gradient(45deg, #fff 8px, transparent 0);
    background-size: 16px 16px;
    background-repeat: repeat-x;
  }
  .receipt-title{
    font-family: var(--font-display);
    font-size: 15px;
    text-align:center;
    margin-bottom: 4px;
  }
  .receipt-sub{
    text-align:center;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }
  .receipt hr{
    border:none; border-top: 1px dashed #c9c9c9; margin: 10px 0;
  }
  .receipt-row{
    display:flex; justify-content: space-between;
  }
  .receipt-score{
    text-align:center;
    font-family: var(--font-display);
    font-size: 44px;
    margin: 8px 0 0;
  }
  .receipt-diagnosis{
    text-align:center;
    font-size: 13px;
    font-weight: 700;
    color: var(--signal);
    margin-bottom: 4px;
    font-family: var(--font-body);
  }

  .result-actions{
    display:flex; gap: 10px; margin-top: 22px;
  }

  .toast{
    position:absolute;
    bottom: 14px; left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--paper);
    font-size: 12px;
    padding: 8px 14px;
    border-radius: 8px;
    opacity: 0;
    pointer-events:none;
    transition: opacity 0.2s ease;
    font-family: var(--font-mono);
  }
  .toast.show{ opacity: 1; }

  .link-fallback{
    position:absolute; inset:0;
    background: rgba(22,34,31,0.6);
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
    z-index: 30;
  }
  .link-fallback-box{
    background: #fff;
    border-radius: 14px;
    padding: 20px;
    width: 100%;
    max-width: 280px;
    text-align:center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  }
  .link-fallback-box p{
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 12px;
  }
  .link-fallback-input{
    width: 100%;
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 10px;
    border: 1px solid var(--paper-dim);
    border-radius: 8px;
    background: var(--paper);
    color: var(--ink);
    margin-bottom: 14px;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="device">
    <div id="device-header">
      <div id="device-label">REFLEX LAB · MODELL RX-4</div>
      <div id="device-dot"></div>
    </div>
    <div id="screen">
      <div id="progress"></div>
      <div class="screen-inner" id="app"></div>
      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>

<script>
const app = document.getElementById('app');
const progressEl = document.getElementById('progress');
const toastEl = document.getElementById('toast');

const TESTS = ['reaction','timing','memory','precision'];
let currentTestIndex = -1;
let scores = {};

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=> toastEl.classList.remove('show'), 1600);
}

async function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){
    try{
      await navigator.clipboard.writeText(text);
      return true;
    }catch(err){ /* fällt durch zum Legacy-Fallback */ }
  }
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if(ok) return true;
  }catch(err){ /* fällt durch zum manuellen Fallback */ }
  return false;
}

function showLinkFallback(text){
  const wrap = document.querySelector('.screen-inner').parentElement;
  const overlay = document.createElement('div');
  overlay.className = 'link-fallback';
  overlay.innerHTML = `
    <div class="link-fallback-box">
      <p>Automatisches Kopieren war hier nicht möglich — markiere den Link und kopiere ihn manuell:</p>
      <input class="link-fallback-input" id="fallbackInput" value="${text.replace(/"/g, '&quot;')}" readonly>
      <button class="signal" id="fallbackClose">Fertig</button>
    </div>
  `;
  wrap.appendChild(overlay);
  const input = document.getElementById('fallbackInput');
  input.focus();
  input.select();
  document.getElementById('fallbackClose').onclick = ()=> overlay.remove();
}

function renderProgress(){
  progressEl.innerHTML = '';
  if(currentTestIndex < 0) return;
  TESTS.forEach((t, i)=>{
    const d = document.createElement('div');
    d.className = 'prog-dot' + (i < currentTestIndex ? ' done' : i === currentTestIndex ? ' active' : '');
    progressEl.appendChild(d);
  });
}

function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function mapRange(v, inMin, inMax, outMin, outMax){
  const t = clamp((v - inMin) / (inMax - inMin), 0, 1);
  return outMin + t * (outMax - outMin);
}

/* ---------------- DAILY SEED ---------------- */
function mulberry32(seed){
  let a = seed;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function dateSeed(){
  const s = new Date().toISOString().slice(0, 10); // YYYY-MM-DD, gleich für alle
  let h = 0;
  for(let i = 0; i < s.length; i++){ h = Math.imul(31, h) + s.charCodeAt(i) | 0; }
  return h;
}
const todayLabel = new Date().toLocaleDateString('de-DE');
let rng = mulberry32(dateSeed());
function resetDailyRng(){ rng = mulberry32(dateSeed()); }

/* ---------------- STREAK ---------------- */
const STREAK_KEY = 'reflexlab_streak';

function todayISO(){ return new Date().toISOString().slice(0, 10); }
function isoDaysAgo(n){
  const d = new Date();
  d.setUTCDate(d.getUTCDate() - n);
  return d.toISOString().slice(0, 10);
}

function readStreak(){
  try{
    const data = JSON.parse(localStorage.getItem(STREAK_KEY));
    if(data && typeof data.count === 'number' && typeof data.lastDate === 'string') return data;
  }catch(err){ /* fällt durch zum Standardwert */ }
  return { count: 0, lastDate: null };
}

function peekStreak(){ return readStreak().count; }

function markPlayedToday(){
  const today = todayISO();
  const data = readStreak();
  if(data.lastDate === today) return data.count;
  const newCount = (data.lastDate === isoDaysAgo(1)) ? data.count + 1 : 1;
  localStorage.setItem(STREAK_KEY, JSON.stringify({ count: newCount, lastDate: today }));
  return newCount;
}

/* ---------------- VERLAUF ---------------- */
const HISTORY_KEY = 'reflexlab_history';

function readHistory(){
  try{
    const data = JSON.parse(localStorage.getItem(HISTORY_KEY));
    if(data && typeof data === 'object') return data;
  }catch(err){ /* fällt durch zum Standardwert */ }
  return {};
}

function recordHistory(overall){
  const history = readHistory();
  history[todayISO()] = overall;
  const cutoff = isoDaysAgo(30);
  Object.keys(history).forEach(date => { if(date < cutoff) delete history[date]; });
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  return history;
}

function last7Days(history){
  const days = [];
  for(let i = 6; i >= 0; i--){
    const date = isoDaysAgo(i);
    if(typeof history[date] === 'number') days.push({ date, score: history[date] });
  }
  return days;
}

function buildSparklineSvg(days){
  const W = 220, H = 44, padY = 6;
  const stepX = days.length > 1 ? (W / (days.length - 1)) : 0;
  const scoreToY = (score) => H - padY - (score / 100) * (H - padY * 2);
  const points = days.map((d, i) => `${i * stepX},${scoreToY(d.score)}`).join(' ');
  const dots = days.map((d, i) => `<circle cx="${i * stepX}" cy="${scoreToY(d.score)}" r="3" fill="#E2412C" />`).join('');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block; margin: 0 auto;">
    <polyline points="${points}" fill="none" stroke="#3F6D66" stroke-width="2" />
    ${dots}
  </svg>`;
}

/* ---------------- LEADERBOARD ---------------- */
const SUPABASE_URL = 'https://djuifrrzclywuweofyrv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_i7k7KvvOFmJlcokjALq73g_vZyS4whr';
const NICKNAME_KEY = 'reflexlab_nickname';

function getNickname(){ return localStorage.getItem(NICKNAME_KEY) || ''; }
function setNickname(name){ localStorage.setItem(NICKNAME_KEY, name); }

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function fetchLeaderboard(date, diff){
  const params = new URLSearchParams({
    play_date: `eq.${date}`,
    difficulty: `eq.${diff}`,
    select: 'nickname,overall',
    order: 'overall.desc,created_at.asc',
    limit: '10',
  });
  const res = await fetch(`${SUPABASE_URL}/rest/v1/leaderboard_entries?${params}`, {
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
    },
  });
  if(!res.ok) throw new Error('leaderboard fetch failed');
  return res.json();
}

async function submitScore(entry){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/leaderboard_entries`, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json',
      Prefer: 'return=minimal',
    },
    body: JSON.stringify(entry),
  });
  if(!res.ok) throw new Error('leaderboard submit failed');
}

function renderLeaderboardRows(rows){
  if(!rows.length) return '<div class="leaderboard-empty">Noch keine Einträge heute — sei die/der Erste!</div>';
  return rows.map((row, i) => `
    <div class="leaderboard-row">
      <span>${i + 1}. ${row.nickname ? escapeHtml(row.nickname) : 'Anonym'}</span>
      <span>${row.overall}</span>
    </div>
  `).join('');
}

/* ---------------- SHARE LINK ---------------- */
function encodeChallenge(obj){
  const json = JSON.stringify(obj);
  return btoa(encodeURIComponent(json).replace(/%([0-9A-F]{2})/g, (_, p) => String.fromCharCode('0x' + p)));
}
function decodeChallenge(str){
  const json = decodeURIComponent(
    Array.prototype.map.call(atob(str), c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')
  );
  return JSON.parse(json);
}
function buildShareUrl(payload){
  const url = new URL(window.location.href);
  url.search = '';
  url.searchParams.set('r', encodeChallenge(payload));
  return url.toString();
}

let incomingChallenge = null;
let challengeDismissed = false;
try{
  const params = new URLSearchParams(window.location.search);
  if(params.has('r')){
    incomingChallenge = decodeChallenge(params.get('r'));
  }
}catch(err){
  incomingChallenge = null;
}

/* ---------------- DIFFICULTY ---------------- */
const DIFFICULTY_KEY = 'reflexlab_difficulty';
const DIFFICULTIES = {
  leicht: {
    label: 'LEICHT',
    reactionScoreRange: [180, 650],
    timingSpeed: 3.0,
    timingZonePct: 26,
    memoryLength: 3,
    memoryFlashMs: 550, memoryGapMs: 300,
    precisionSize: { mobile: 320, desktop: 90 },
    precisionTimeoutMs: 1500,
  },
  normal: {
    label: 'NORMAL',
    reactionScoreRange: [180, 550],
    timingSpeed: 4.2,
    timingZonePct: 18,
    memoryLength: 4,
    memoryFlashMs: 500, memoryGapMs: 250,
    precisionSize: { mobile: 280, desktop: 70 },
    precisionTimeoutMs: 1150,
  },
  schwer: {
    label: 'SCHWER',
    reactionScoreRange: [150, 450],
    timingSpeed: 6.0,
    timingZonePct: 12,
    memoryLength: 6,
    memoryFlashMs: 350, memoryGapMs: 150,
    precisionSize: { mobile: 200, desktop: 56 },
    precisionTimeoutMs: 800,
  },
};
let difficulty = DIFFICULTIES[localStorage.getItem(DIFFICULTY_KEY)] ? localStorage.getItem(DIFFICULTY_KEY) : 'normal';
function setDifficulty(d){
  difficulty = DIFFICULTIES[d] ? d : 'normal';
  localStorage.setItem(DIFFICULTY_KEY, difficulty);
}
function diffCfg(){ return DIFFICULTIES[difficulty]; }

/* ---------------- INTRO ---------------- */
function renderIntro(){
  currentTestIndex = -1;
  renderProgress();

  if(incomingChallenge && !challengeDismissed){
    const c = incomingChallenge;
    const challengeDiff = DIFFICULTIES[c.diff] ? c.diff : 'normal';
    app.innerHTML = `
      <div class="eyebrow">Tages-Challenge · ${c.date || todayLabel}</div>
      <h1 class="display" style="font-size:24px;">HERAUSGEFORDERT</h1>
      <p class="sub">Jemand hat heute auf <strong>${DIFFICULTIES[challengeDiff].label}</strong> <strong>${c.overall}/100</strong> erreicht — Diagnose: „${c.diag}“. Schaffst du mehr?</p>
      ${peekStreak() > 0 ? `<div class="streak-badge">🔥 ${peekStreak()} ${peekStreak() === 1 ? 'Tag' : 'Tage'} in Folge</div>` : ''}
      <div class="challenge-stats">
        <div class="row"><span>REAKTION</span><span>${c.r}ms</span></div>
        <div class="row"><span>TIMING</span><span>${c.t}%</span></div>
        <div class="row"><span>GEDÄCHTNIS</span><span>${c.m}</span></div>
        <div class="row"><span>PRÄZISION</span><span>${c.p}%</span></div>
      </div>
      ${achievementsByIds(c.ach).length ? `<div class="achievements">${achievementsByIds(c.ach).map(a => `<span class="achievement-badge" title="${a.desc}">${a.icon} ${a.label}</span>`).join('')}</div>` : ''}
      <button class="signal" id="startBtn" style="margin-top:18px;">Challenge annehmen</button>
      <button class="ghost" id="skipBtn" style="margin-top:10px;">Eigene Runde starten</button>
    `;
    document.getElementById('startBtn').onclick = ()=>{ challengeDismissed = true; setDifficulty(challengeDiff); resetDailyRng(); nextTest(); };
    document.getElementById('skipBtn').onclick = ()=>{ challengeDismissed = true; renderIntro(); };
    return;
  }

  app.innerHTML = `
    <div class="eyebrow">Tages-Challenge · ${todayLabel}</div>
    <h1 class="display">REFLEX LAB</h1>

const REACTION_COLORS = [

function renderReaction(){
  const target = REACTION_COLORS[Math.floor(rng() * REACTION_COLORS.length)];

  app.innerHTML = `
    <div class="reaction-zone wait" id="rzone">
      <div class="reaction-word" id="rword">WARTEN...</div>
      <div class="reaction-hint">Tippe erst wenn's <strong>${target.name}</strong> wird</div>
    </div>
  `;
  const zone = document.getElementById('rzone');
  const word = document.getElementById('rword');
  let state = 'wait';
  let goTime = 0;
  const delay = 1000 + rng() * 2200;

  const timer = setTimeout(()=>{
    state = 'go';
    zone.classList.remove('wait');
    zone.style.background = target.hex;
    word.textContent = 'JETZT!';
    goTime = performance.now();
  }, delay);

/* ---------------- TEST 2: TIMING ---------------- */
function renderTiming(){
  const isMobile = window.matchMedia('(max-width: 480px)').matches;
  app.innerHTML = `
    <div class="eyebrow">Test 2 / 4</div>
    <h1 class="display" style="font-size:22px;">TIMING</h1>
    <p class="sub">${isMobile ? 'Tippe irgendwo auf den Screen, wenn die Nadel in der Zielzone ist.' : 'Stoppe die Nadel in der Zielzone.'}</p>
    <div class="timing-track">
      <div class="timing-target" id="timingTarget"></div>
      <div class="timing-needle" id="needle"></div>
    </div>
    ${isMobile ? '' : '<button class="ghost" id="stopBtn">STOPPEN</button>'}
  `;
  const track = document.querySelector('.timing-track');
  const needle = document.getElementById('needle');
  const zonePct = diffCfg().timingZonePct;
  const targetEl = document.getElementById('timingTarget');
  targetEl.style.width = zonePct + '%';
  targetEl.style.left = ((100 - zonePct) / 2) + '%';
  const trackWidth = track.offsetWidth;
  let pos = 0;
  let dir = 1;
  const speed = diffCfg().timingSpeed;
  let running = true;

  function tick(){
    if(!running) return;
    pos += dir * speed;
    if(pos >= trackWidth - 4){ pos = trackWidth - 4; dir = -1; }
    if(pos <= 0){ pos = 0; dir = 1; }
    needle.style.left = pos + 'px';
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function stop(){
    if(!running) return;
    running = false;
    const center = trackWidth * 0.5;
    const dist = Math.abs(pos - center);
    const accuracy = Math.round(mapRange(dist, 0, trackWidth * 0.5, 100, 0));
    scores.timing = { accuracy, score: accuracy };
    nextTest();
  }

  if(isMobile){
    setTimeout(()=> app.addEventListener('click', stop), 0);
  } else {
    document.getElementById('stopBtn').onclick = stop;
  }
}

/* ---------------- TEST 3: MEMORY ---------------- */
function renderMemory(){
  app.innerHTML = `
    <div class="eyebrow">Test 3 / 4</div>
    <h1 class="display" style="font-size:22px;">GEDÄCHTNIS</h1>
    <p class="sub" id="memSub">Merk dir die Reihenfolge...</p>
    <div class="memory-grid" id="grid"></div>
  `;
  const grid = document.getElementById('grid');
  const sub = document.getElementById('memSub');
  const tiles = [];
  for(let i=0;i<9;i++){
    const t = document.createElement('div');
    t.className = 'memory-tile';
    t.dataset.idx = i;
    grid.appendChild(t);
    tiles.push(t);
  }
  const memoryLength = diffCfg().memoryLength;
  const flashMs = diffCfg().memoryFlashMs;
  const gapMs = diffCfg().memoryGapMs;
  const sequence = [];
  while(sequence.length < memoryLength){
    const idx = Math.floor(rng()*9);
    if(!sequence.includes(idx)) sequence.push(idx);
  }

  let i = 0;
  function flashNext(){
    if(i >= sequence.length){
      sub.textContent = 'Jetzt du: tippe die Reihenfolge nach';
      enableInput();
      return;
    }
    const tile = tiles[sequence[i]];
    tile.classList.add('flash');
    setTimeout(()=>{
      tile.classList.remove('flash');
      i++;
      setTimeout(flashNext, gapMs);
    }, flashMs);
  }
  setTimeout(flashNext, 600);

  function enableInput(){
    let userSeq = [];
    tiles.forEach(t=>{
      t.onclick = ()=>{
        if(userSeq.length >= sequence.length) return;
        t.classList.add('picked');
        userSeq.push(Number(t.dataset.idx));
        if(userSeq.length === sequence.length){
          let correct = 0;
          userSeq.forEach((v,idx)=>{ if(v === sequence[idx]) correct++; });
          scores.memory = { correct, total: sequence.length, score: Math.round((correct/sequence.length)*100) };
          setTimeout(nextTest, 400);
        }
      };
    });
  }
}

/* ---------------- TEST 4: PRECISION ---------------- */
function renderPrecision(){
  app.innerHTML = `
    <div class="eyebrow">Test 4 / 4</div>
    <h1 class="display" style="font-size:22px;">PRÄZISION</h1>
    <p class="sub">Triff die Mitte der 3 Ziele.</p>
    <div class="precision-field" id="field"></div>
  `;
  const field = document.getElementById('field');
  const fieldRect = () => ({ width: field.offsetWidth, height: field.offsetHeight });
  let round = 0;
  const results = [];
  const isMobilePrecision = window.matchMedia('(max-width: 480px)').matches;
  const SIZE_START = isMobilePrecision ? diffCfg().precisionSize.mobile : diffCfg().precisionSize.desktop;
  const TARGET_TIMEOUT_MS = diffCfg().precisionTimeoutMs;

  function spawnTarget(){
    const size = SIZE_START;
    const rect = fieldRect();
    const maxX = rect.width - size - 10;
    const maxY = rect.height - size - 10;
    const x = 10 + rng() * Math.max(maxX, 10);
    const y = 10 + rng() * Math.max(maxY, 10);

    const target = document.createElement('div');
    target.className = 'precision-target';
    target.style.width = size + 'px';
    target.style.height = size + 'px';
    target.style.left = x + 'px';
    target.style.top = y + 'px';
    target.style.transition = 'width 1.1s linear, height 1.1s linear, left 1.1s linear, top 1.1s linear';
    field.appendChild(target);

    requestAnimationFrame(()=>{
      const shrink = size * 0.35;
      target.style.width = shrink + 'px';
      target.style.height = shrink + 'px';
      target.style.left = (x + (size-shrink)/2) + 'px';
      target.style.top = (y + (size-shrink)/2) + 'px';
    });

    let clicked = false;
    const timeout = setTimeout(()=>{
      if(clicked) return;
      clicked = true;
      results.push(0);
      target.remove();
      advance();
    }, TARGET_TIMEOUT_MS);

    target.onclick = (e)=>{
      if(clicked) return;
      clicked = true;
      clearTimeout(timeout);
      const tRect = target.getBoundingClientRect();
      const cx = tRect.left + tRect.width/2;
      const cy = tRect.top + tRect.height/2;
      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const acc = Math.round(mapRange(dist, 0, tRect.width, 100, 0));
      results.push(clamp(acc,0,100));
      target.remove();
      advance();
    };
  }

  function advance(){
    round++;
    if(round >= 3){
      const avg = Math.round(results.reduce((a,b)=>a+b,0)/results.length);
      scores.precision = { score: avg };
      nextTest();
    } else {
      setTimeout(spawnTarget, 250);
    }
  }
  spawnTarget();
}

  if(score >= 90) return pick(DIAGNOSES.s90);

/* ---------------- SHARE CARD (Canvas) ---------------- */
function buildCardCanvas(data){
  const { overall, diag, r, t, m, p, diffLabel, achievements = [] } = data;
  const W = 640;
  const H = 900 + (achievements.length ? 110 : 0);
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // paper background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  // subtle top strip
  ctx.fillStyle = '#EDF1EC';
  ctx.fillRect(0, 0, W, 64);

  const centerX = W / 2;
  ctx.textAlign = 'center';

  ctx.fillStyle = '#4A5A55';
  ctx.font = '700 15px "Space Mono", monospace';
  ctx.fillText(`REFLEX LAB · TAGES-CHALLENGE · ${diffLabel}`, centerX, 40);

  ctx.fillStyle = '#16221F';
  ctx.font = '700 17px "Space Mono", monospace';
  ctx.fillText(new Date().toLocaleDateString('de-DE'), centerX, 105);

  dashedLine(ctx, 40, 130, W - 40, 130);

  ctx.fillStyle = '#E2412C';
  ctx.font = '700 24px Inter, sans-serif';
  ctx.fillText(diag.title, centerX, 180);

  ctx.fillStyle = '#16221F';
  ctx.font = '900 130px "Archivo Black", sans-serif';
  ctx.fillText(String(overall), centerX, 320);

  ctx.fillStyle = '#4A5A55';
  ctx.font = '400 15px Inter, sans-serif';
  ctx.fillText(diag.note, centerX, 360);

  dashedLine(ctx, 40, 400, W - 40, 400);

  const rows = [
    ['REAKTION', r.ms + 'ms'],
    ['TIMING', t.accuracy + '%'],
    ['GEDÄCHTNIS', m.correct + '/' + m.total],
    ['PRÄZISION', p.score + '%'],
  ];
  ctx.font = '700 20px "Space Mono", monospace';
  let y = 445;
  rows.forEach(([label, val])=>{
    ctx.textAlign = 'left';
    ctx.fillStyle = '#4A5A55';
    ctx.fillText(label, 60, y);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#16221F';
    ctx.fillText(val, W - 60, y);
    y += 42;
  });

  let contentY = y + 10;
  dashedLine(ctx, 40, contentY, W - 40, contentY);

  if(achievements.length){
    contentY = drawBadges(ctx, achievements, contentY + 32, W);
    dashedLine(ctx, 40, contentY, W - 40, contentY);
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#4A5A55';
  ctx.font = '400 13px "Space Mono", monospace';
  ctx.fillText('ENDE DER PRÜFUNG', centerX, contentY + 35);

  ctx.fillStyle = '#16221F';
  ctx.font = '700 16px Inter, sans-serif';
  ctx.fillText('Schlag das Ergebnis 👉', centerX, H - 60);

  // torn edge effect at bottom
  ctx.fillStyle = '#EDF1EC';
  const teeth = 20;
  const toothWidth = W / teeth;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for(let i = 0; i <= teeth; i++){
    const x = i * toothWidth;
    ctx.lineTo(x, H - (i % 2 === 0 ? 14 : 0));
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();

  return canvas;
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBadges(ctx, badges, startY, W){
  const padX = 40;
  const maxWidth = W - padX * 2;
  const gap = 10;
  const pillHeight = 34;
  const lineGap = 10;

  ctx.font = '700 15px "Space Mono", monospace';
  const items = badges.map(b => {
    const text = `${b.icon} ${b.label}`;
    return { text, w: ctx.measureText(text).width + 24 };
  });

  const rows = [];
  let currentRow = [];
  let currentWidth = 0;
  items.forEach(item => {
    if(currentRow.length && currentWidth + gap + item.w > maxWidth){
      rows.push(currentRow);
      currentRow = [];
      currentWidth = 0;
    }
    currentRow.push(item);
    currentWidth += (currentRow.length > 1 ? gap : 0) + item.w;
  });
  if(currentRow.length) rows.push(currentRow);

  let y = startY;
  rows.forEach(row => {
    const rowWidth = row.reduce((sum, item) => sum + item.w, 0) + gap * (row.length - 1);
    let x = (W - rowWidth) / 2;
    row.forEach(item => {
      ctx.fillStyle = '#F2B705';
      roundRect(ctx, x, y, item.w, pillHeight, pillHeight / 2);
      ctx.fill();
      ctx.fillStyle = '#16221F';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(item.text, x + 12, y + pillHeight / 2 + 1);
      x += item.w + gap;
    });
    y += pillHeight + lineGap;
  });

  ctx.textBaseline = 'alphabetic';
  return y;
}

function dashedLine(ctx, x1, y, x2, y2){
  ctx.save();
  ctx.strokeStyle = '#c9c9c9';
  ctx.setLineDash([6, 5]);
  ctx.beginPath();
  ctx.moveTo(x1, y);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.restore();
}

async function shareCard(data){
  showToast('Karte wird erstellt...');
  // give fonts a beat to be ready
  if(document.fonts && document.fonts.ready){ await document.fonts.ready; }
  const canvas = buildCardCanvas(data);

  canvas.toBlob(async (blob)=>{
    if(!blob){ showToast('Karte konnte nicht erstellt werden'); return; }
    const file = new File([blob], 'reflex-lab-ergebnis.png', { type: 'image/png' });

    if(navigator.canShare && navigator.canShare({ files: [file] })){
      try{
        await navigator.share({
          files: [file],
          title: 'Reflex Lab Ergebnis',
          text: data.shareText,
        });
        return;
      }catch(err){
        // user cancelled or share failed — fall through to download
      }
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'reflex-lab-ergebnis.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Karte heruntergeladen ✓');
  }, 'image/png');
}

renderIntro();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js');
}
