<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>REFLEX LAB — Test dein Nervensystem</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C2523">
<link rel="icon" href="icons/icon-32.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reflex Lab">
<link rel="stylesheet" href="styles.css">
<style>
  /* ---------- Leaderboard ---------- */
  .leaderboard-card{
    width: 100%;
    max-width: 260px;
    background: #fff;
    color: var(--ink);
    padding: 18px 18px 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    margin-top: 14px;
    text-align: left;
  }
  .leaderboard-title{
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    text-align: center;
    margin-bottom: 10px;
  }
  .leaderboard-list{
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 12px;
  }
  .leaderboard-row{
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 12.5px;
  }
  .leaderboard-row span:first-child{
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 180px;
  }
  .leaderboard-empty{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
  }
  .leaderboard-form{
    display: flex;
    gap: 6px;
    border-top: 1px dashed #c9c9c9;
    padding-top: 12px;
  }
  .nickname-input{
    flex: 1;
    min-width: 0;
    font-family: var(--font-body);
    font-size: 13px;
    padding: 8px 10px;
    border: 1px solid var(--paper-dim);
    border-radius: 8px;
    background: var(--paper);
    color: var(--ink);
  }
  .leaderboard-form button{
    padding: 8px 14px;
    font-size: 13px;
    white-space: nowrap;
  }

  /* ---------- Sparkline ---------- */
  .sparkline-wrap{
    margin-top: 12px;
    text-align: center;
  }
  .sparkline-label{
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  /* ---------- Achievement badges ---------- */
  .achievements{
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin: 12px 0 0;
  }
  .achievement-badge{
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 700;
    color: var(--ink);
    background: var(--yellow);
    padding: 5px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .new-tag{
    background: var(--signal);
    color: #fff;
    font-size: 8.5px;
    padding: 2px 5px;
    border-radius: 10px;
    margin-left: 5px;
  }

  /* ---------- Streak badge ---------- */
  .streak-badge{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
    background: var(--paper-dim);
    padding: 6px 14px;
    border-radius: 20px;
    margin-bottom: 18px;
  }

  /* ---------- Text link ---------- */
  .text-link{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  /* ---------- Challenge stats ---------- */
  .challenge-stats{
    font-family: var(--font-mono);
    font-size: 12px;
    width: 100%;
    max-width: 220px;
    margin: -12px 0 24px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .challenge-stats .row{
    display:flex; justify-content: space-between;
    color: var(--ink-soft);
  }
  .challenge-stats .row span:last-child{
    color: var(--ink);
    font-weight: 700;
  }

  /* ---------- Difficulty picker ---------- */
  .diff-picker{
    display:flex;
    gap: 8px;
    margin: 0 0 22px;
  }
  .diff-chip{
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 20px;
    background: transparent;
    color: var(--ink-soft);
    box-shadow: 0 0 0 1.5px var(--paper-dim) inset;
    transition: none;
  }
  .diff-chip.active{
    background: var(--ink);
    color: var(--paper);
    box-shadow: none;
  }

  /* ---------- Practice menu ---------- */
  .practice-group{
    width: 100%;
    text-align: left;
    margin-bottom: 14px;
  }
  .practice-group-label{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .practice-group .diff-picker{
    margin: 0;
    flex-wrap: wrap;
  }

  /* ---------- Progress dots ---------- */
  #progress{
    position:absolute;
    top: 16px; left: 0; right:0;
    display:flex;
    gap: 6px;
    justify-content:center;
    z-index: 5;
  }
  .prog-dot{
    width: 22px; height: 4px; border-radius: 2px;
    background: var(--paper-dim);
  }
  .prog-dot.done{ background: var(--teal); }
  .prog-dot.active{ background: var(--signal); }

  /* ---------- Reaction test ---------- */
  .reaction-zone{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    transition: background 0.15s ease;
  }
  .reaction-zone.wait{ background: var(--signal-dim); }
  .reaction-zone.go{ background: #C9E4B8; }
  .reaction-zone.early{ background: var(--signal); }
  .reaction-word{
    font-family: var(--font-display);
    font-size: 28px;
    color: var(--ink);
  }
  .reaction-hint{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 8px;
  }
  .reaction-choice-wrap{
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 4px;
    box-sizing: border-box;
  }
  .reaction-choice{
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 6px;
  }
  .reaction-quad{
    background: var(--signal-dim);
    transition: background 0.12s ease;
  }
  .reaction-quad.lit{ background: var(--signal); }
  .reaction-quad.hit{ background: #C9E4B8; }

  /* ---------- Timing test ---------- */
  .timing-track{
    position: relative;
    width: 100%;
    height: 54px;
    background: var(--paper-dim);
    border-radius: 8px;
    margin: 18px 0 30px;
    overflow: hidden;
  }
  .timing-target{
    position: absolute;
    top: 0; bottom: 0;
    width: 18%;
    left: 41%;
    background: rgba(63,109,102,0.25);
    border-left: 2px dashed var(--teal);
    border-right: 2px dashed var(--teal);
  }
  .timing-needle{
    position: absolute;
    top: 0; bottom: 0;
    width: 4px;
    background: var(--signal);
  }
  .timing-beacon{
    position: absolute;
    top: 50%; left: 50%;
    width: 26px; height: 26px;
    margin: -13px 0 0 -13px;
    border-radius: 50%;
    background: var(--paper);
    border: 2px solid var(--teal);
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .timing-beacon.pulse{
    background: var(--signal);
    border-color: var(--signal);
    transform: scale(1.4);
  }
  .timing-stopline{
    position: absolute;
    top: 0; bottom: 0;
    width: 3px;
    background: var(--teal);
    box-shadow: 0 0 0 4px rgba(63,109,102,0.18);
  }

  /* ---------- Memory test ---------- */
  .memory-grid{
    display:grid;
    grid-template-columns: repeat(3, 64px);
    gap: 10px;
    margin: 10px 0 24px;
  }
  .memory-tile{
    width: 64px; height: 64px;
    background: var(--paper-dim);
    border-radius: 12px;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .memory-tile.flash{ background: var(--yellow); }
  .memory-tile.picked{ background: var(--teal); }
  .memory-tile:active{ transform: scale(0.94); }
  .pairs-grid{
    grid-template-columns: repeat(4, 48px);
    gap: 8px;
  }
  .pairs-tile{
    width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono);
    font-size: 15px;
    color: var(--ink);
  }

  /* ---------- Precision test ---------- */
  .precision-field{
    position: absolute; inset: 0;
    touch-action: none;
  }
  .precision-target{
    position: absolute;
    border-radius: 50%;
    background: var(--signal);
    box-shadow: 0 0 0 6px rgba(226,65,44,0.15);
  }
  .precision-cursor{
    position: absolute;
    border-radius: 50%;
    border: 2px solid var(--teal);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
  }
  .precision-ring{
    position: absolute;
    border-radius: 50%;
    border: 3px solid var(--teal);
    box-sizing: border-box;
    pointer-events: none;
  }
  .precision-ring.inside{
    border-color: var(--signal);
    background: rgba(226,65,44,0.08);
  }

  /* ---------- Result receipt ---------- */
  .receipt{
    width: 100%;
    max-width: 260px;
    background: #fff;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 12.5px;
    line-height: 1.7;
    padding: 20px 18px 26px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    position: relative;
  }
  .receipt::after{
    content: "";
    position: absolute;
    left:0; right:0; bottom: -9px;
    height: 18px;
    background:
      linear-gradient(-45deg, #fff 8px, transparent 0),
      linear-gradient(45deg, #fff 8px, transparent 0);
    background-size: 16px 16px;
    background-repeat: repeat-x;
  }
  .receipt-title{
    font-family: var(--font-display);
    font-size: 15px;
    text-align:center;
    margin-bottom: 4px;
  }
  .receipt-sub{
    text-align:center;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }
  .receipt hr{
    border:none; border-top: 1px dashed #c9c9c9; margin: 10px 0;
  }
  .receipt-row{
    display:flex; justify-content: space-between;
  }
  .receipt-score{
    text-align:center;
    font-family: var(--font-display);
    font-size: 44px;
    margin: 8px 0 0;
  }
  .receipt-diagnosis{
    text-align:center;
    font-size: 13px;
    font-weight: 700;
    color: var(--signal);
    margin-bottom: 4px;
    font-family: var(--font-body);
  }

  .result-actions{
    display:flex; gap: 10px; margin-top: 22px;
  }

  .toast{
    position:absolute;
    bottom: 14px; left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--paper);
    font-size: 12px;
    padding: 8px 14px;
    border-radius: 8px;
    opacity: 0;
    pointer-events:none;
    transition: opacity 0.2s ease;
    font-family: var(--font-mono);
  }
  .toast.show{ opacity: 1; }

  .link-fallback{
    position:absolute; inset:0;
    background: rgba(22,34,31,0.6);
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
    z-index: 30;
  }
  .link-fallback-box{
    background: #fff;
    border-radius: 14px;
    padding: 20px;
    width: 100%;
    max-width: 280px;
    text-align:center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  }
  .link-fallback-box p{
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 12px;
  }
  .link-fallback-input{
    width: 100%;
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 10px;
    border: 1px solid var(--paper-dim);
    border-radius: 8px;
    background: var(--paper);
    color: var(--ink);
    margin-bottom: 14px;
  }

  /* ---------- REX Maskottchen ---------- */
  .rex-mascot{
    --pixel: 6px;
    --state-color: var(--signal);
    position: relative;
    width: calc(var(--pixel) * 18);
    height: calc(var(--pixel) * 20);
    margin: 4px auto 18px;
    flex-shrink: 0;
    image-rendering: pixelated;
  }
  .rex-mascot .rex{
    position: relative;
    width: 100%;
    height: 100%;
    animation: rex-idle-body 1.8s steps(4, end) infinite;
  }
  .rex-mascot .antenna{
    position: absolute;
    z-index: 0;
    top: 0;
    left: calc(var(--pixel) * 8);
    width: calc(var(--pixel) * 2);
    height: calc(var(--pixel) * 5);
    transform-origin: 50% 100%;
    transition: transform .2s steps(2, end);
  }
  .rex-mascot .antenna::before{
    content: "";
    position: absolute;
    bottom: 0;
    left: calc(var(--pixel) * .5);
    width: var(--pixel);
    height: calc(var(--pixel) * 4);
    background: var(--ink-soft);
  }
  .rex-mascot .antenna::after{
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: calc(var(--pixel) * 2);
    height: calc(var(--pixel) * 2);
    background: var(--state-color);
    border: calc(var(--pixel) * .5) solid var(--device-edge);
    box-sizing: content-box;
    box-shadow: 0 0 10px rgba(226,65,44,.35);
    transition: background .18s steps(2, end);
  }
  .rex-mascot .ear{
    position: absolute;
    z-index: 1;
    top: calc(var(--pixel) * 7);
    width: calc(var(--pixel) * 2);
    height: calc(var(--pixel) * 6);
    background: var(--ink);
    border-block: var(--pixel) solid var(--device-edge);
  }
  .rex-mascot .ear.left{ left: 0; border-left: var(--pixel) solid var(--device-edge); }
  .rex-mascot .ear.right{ right: 0; border-right: var(--pixel) solid var(--device-edge); }
  .rex-mascot .head{
    position: absolute;
    z-index: 2;
    top: calc(var(--pixel) * 4);
    left: calc(var(--pixel) * 2);
    width: calc(var(--pixel) * 14);
    height: calc(var(--pixel) * 11);
    border: var(--pixel) solid var(--device-edge);
    background: var(--ink);
    box-shadow:
      inset calc(var(--pixel) * -1) calc(var(--pixel) * -1) 0 var(--device-edge),
      inset var(--pixel) var(--pixel) 0 var(--ink-soft);
  }
  .rex-mascot .faceplate{
    position: absolute;
    inset: calc(var(--pixel) * 2) var(--pixel) var(--pixel);
    background: var(--device-edge);
    border: var(--pixel) solid var(--device-edge);
  }
  .rex-mascot .eye{
    position: absolute;
    top: var(--pixel);
    left: var(--pixel);
    width: calc(var(--pixel) * 4);
    height: calc(var(--pixel) * 3);
    background: var(--state-color);
    box-shadow: 0 0 14px rgba(226,65,44,.35);
    transition: all .18s steps(2, end), background .18s steps(2, end);
    animation: rex-eye-blink 4.4s steps(1, end) infinite;
  }
  .rex-mascot .eye::after{
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: var(--pixel);
    height: var(--pixel);
    background: var(--signal-dim);
  }
  .rex-mascot .brow{
    position: absolute;
    top: 0;
    left: var(--pixel);
    width: calc(var(--pixel) * 4);
    height: var(--pixel);
    background: var(--ink-soft);
    transform-origin: left center;
    transition: transform .18s steps(2, end);
  }
  .rex-mascot .mouth{
    position: absolute;
    right: var(--pixel);
    bottom: var(--pixel);
    width: calc(var(--pixel) * 3);
    height: var(--pixel);
    background: var(--ink-soft);
    transition: all .18s steps(2, end);
  }
  .rex-mascot .bolt{
    position: absolute;
    right: 0;
    top: 0;
    width: var(--pixel);
    height: var(--pixel);
    background: var(--ink-soft);
  }
  .rex-mascot .neck{
    position: absolute;
    z-index: 1;
    left: calc(var(--pixel) * 7);
    top: calc(var(--pixel) * 14);
    width: calc(var(--pixel) * 4);
    height: calc(var(--pixel) * 2);
    border-inline: var(--pixel) solid var(--device-edge);
    background: var(--device-edge);
  }
  .rex-mascot .foot{
    position: absolute;
    z-index: 0;
    top: calc(var(--pixel) * 15);
    width: calc(var(--pixel) * 6);
    height: calc(var(--pixel) * 4);
    background: var(--ink);
    border: var(--pixel) solid var(--device-edge);
    transition: transform .2s steps(2, end);
  }
  .rex-mascot .foot.left{ left: calc(var(--pixel) * 2); }
  .rex-mascot .foot.right{ right: calc(var(--pixel) * 2); }
  .rex-mascot .feet-base{
    position: absolute;
    top: calc(var(--pixel) * 18);
    left: var(--pixel);
    width: calc(var(--pixel) * 16);
    height: calc(var(--pixel) * 2);
  }
  .rex-mascot .feet-base::before,
  .rex-mascot .feet-base::after{
    content: "";
    position: absolute;
    bottom: 0;
    width: calc(var(--pixel) * 6);
    height: var(--pixel);
    background: var(--device-edge);
  }
  .rex-mascot .feet-base::before{ left: 0; }
  .rex-mascot .feet-base::after{ right: 0; }
  .rex-mascot .spark{
    position: absolute;
    z-index: 4;
    width: var(--pixel);
    height: var(--pixel);
    background: var(--state-color);
    opacity: 0;
  }
  .rex-mascot .spark.one{ top: 12%; left: 18%; }
  .rex-mascot .spark.two{ top: 20%; right: 16%; }
  .rex-mascot .spark.three{ top: 48%; right: 10%; }

  /* Fokus */
  .rex-mascot--focus .rex{ animation: rex-focus-body .45s steps(2, end) infinite; }
  .rex-mascot--focus .antenna{ animation: rex-antenna-alert .32s steps(2, end) infinite; }
  .rex-mascot--focus .eye{
    width: calc(var(--pixel) * 5);
    height: calc(var(--pixel) * 2);
    animation: rex-eye-scan .55s steps(3, end) infinite;
  }
  .rex-mascot--focus .brow{ transform: translateY(calc(var(--pixel) * -0.4)) rotate(-8deg); }
  .rex-mascot--focus .mouth{ width: calc(var(--pixel) * 2); right: calc(var(--pixel) * 1.5); }

  /* Neuer Rekord */
  .rex-mascot--record{ --state-color: var(--yellow); }
  .rex-mascot--record .rex{ animation: rex-record-hop .7s steps(4, end) infinite; }
  .rex-mascot--record .antenna{ animation: rex-antenna-cheer .35s steps(2, end) infinite alternate; }
  .rex-mascot--record .eye{
    width: calc(var(--pixel) * 4);
    height: calc(var(--pixel) * 4);
    transform: translateY(calc(var(--pixel) * -0.5));
    animation: rex-record-eye .5s steps(2, end) infinite;
  }
  .rex-mascot--record .brow{ transform: translateY(calc(var(--pixel) * -0.5)); }
  .rex-mascot--record .mouth{
    width: calc(var(--pixel) * 4);
    height: calc(var(--pixel) * 2);
    right: calc(var(--pixel) * .5);
    bottom: calc(var(--pixel) * .5);
    background: linear-gradient(to bottom, transparent 0 50%, var(--ink-soft) 50% 100%);
    border-inline: var(--pixel) solid var(--ink-soft);
  }
  .rex-mascot--record .spark{ animation: rex-spark-pop .7s steps(3, end) infinite; }
  .rex-mascot--record .spark.two{ animation-delay: .18s; }
  .rex-mascot--record .spark.three{ animation-delay: .32s; }

  /* Zu langsam */
  .rex-mascot--slow{ --state-color: var(--ink-soft); }
  .rex-mascot--slow .rex{ animation: rex-slow-sink 1.6s steps(3, end) infinite; }
  .rex-mascot--slow .antenna{ transform: rotate(54deg) translate(calc(var(--pixel) * .5), calc(var(--pixel) * .4)); }
  .rex-mascot--slow .antenna::after{ opacity: .5; box-shadow: none; }
  .rex-mascot--slow .eye{
    width: calc(var(--pixel) * 4);
    height: var(--pixel);
    top: calc(var(--pixel) * 2);
    opacity: .55;
    box-shadow: none;
    animation: none;
  }
  .rex-mascot--slow .brow{ transform: translateY(var(--pixel)) rotate(10deg); }
  .rex-mascot--slow .mouth{
    width: calc(var(--pixel) * 3);
    height: calc(var(--pixel) * 2);
    right: var(--pixel);
    bottom: 0;
    background: linear-gradient(135deg, transparent 0 36%, var(--ink-soft) 36% 62%, transparent 62%);
  }
  .rex-mascot--slow .foot.left{ transform: translateX(var(--pixel)); }
  .rex-mascot--slow .foot.right{ transform: translateX(calc(var(--pixel) * -1)); }

  @keyframes rex-idle-body{ 0%, 100% { transform: translateY(0); } 50% { transform: translateY(calc(var(--pixel) * -0.5)); } }
  @keyframes rex-eye-blink{ 0%, 44%, 48%, 100% { transform: scaleY(1); } 45%, 47% { transform: scaleY(.25); } }
  @keyframes rex-focus-body{ 50% { transform: translateX(calc(var(--pixel) * .25)); } }
  @keyframes rex-antenna-alert{ 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  @keyframes rex-eye-scan{ 0% { transform: translateX(0); } 50% { transform: translateX(var(--pixel)); } 100% { transform: translateX(0); } }
  @keyframes rex-record-hop{
    0%, 100% { transform: translateY(0) rotate(0); }

async function copyToClipboard(text){

    }catch(err){ /* fällt durch zum Legacy-Fallback */ }

function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function mapRange(v, inMin, inMax, outMin, outMax){

  return outMin + t * (outMax - outMin);
}

/* ---------------- DAILY SEED ---------------- */
function mulberry32(seed){
  let a = seed;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function dateSeed(){
  const s = new Date().toISOString().slice(0, 10); // YYYY-MM-DD, gleich für alle
  let h = 0;
  for(let i = 0; i < s.length; i++){ h = Math.imul(31, h) + s.charCodeAt(i) | 0; }
  return h;
}

const STREAK_KEY = 'reflexlab_streak';

function todayISO(){ return new Date().toISOString().slice(0, 10); }
function isoDaysAgo(n){
  const d = new Date();
  d.setUTCDate(d.getUTCDate() - n);
  return d.toISOString().slice(0, 10);
}

function readStreak(){
  try{
    const data = JSON.parse(localStorage.getItem(STREAK_KEY));
    if(data && typeof data.count === 'number' && typeof data.lastDate === 'string') return data;
  }catch(err){ /* fällt durch zum Standardwert */ }
  return { count: 0, lastDate: null };
}

function peekStreak(){ return readStreak().count; }

function markPlayedToday(){
  const today = todayISO();
  const data = readStreak();
  if(data.lastDate === today) return data.count;
  const newCount = (data.lastDate === isoDaysAgo(1)) ? data.count + 1 : 1;
  localStorage.setItem(STREAK_KEY, JSON.stringify({ count: newCount, lastDate: today }));
  return newCount;
}

/* ---------------- VERLAUF ---------------- */
const HISTORY_KEY = 'reflexlab_history';

function readHistory(){
  try{
    const data = JSON.parse(localStorage.getItem(HISTORY_KEY));
    if(data && typeof data === 'object') return data;
  }catch(err){ /* fällt durch zum Standardwert */ }
  return {};
}

function recordHistory(overall){
  const history = readHistory();
  history[todayISO()] = overall;
  const cutoff = isoDaysAgo(30);
  Object.keys(history).forEach(date => { if(date < cutoff) delete history[date]; });
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  return history;
}

function last7Days(history){
  const days = [];
  for(let i = 6; i >= 0; i--){
    const date = isoDaysAgo(i);
    if(typeof history[date] === 'number') days.push({ date, score: history[date] });
  }
  return days;
}

function buildSparklineSvg(days){
  const W = 220, H = 44, padY = 6;
  const stepX = days.length > 1 ? (W / (days.length - 1)) : 0;
  const scoreToY = (score) => H - padY - (score / 100) * (H - padY * 2);
  const points = days.map((d, i) => `${i * stepX},${scoreToY(d.score)}`).join(' ');
  const dots = days.map((d, i) => `<circle cx="${i * stepX}" cy="${scoreToY(d.score)}" r="3" fill="#E2412C" />`).join('');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block; margin: 0 auto;">
    <polyline points="${points}" fill="none" stroke="#3F6D66" stroke-width="2" />
    ${dots}
  </svg>`;
}

function encodeChallenge(obj){

  return btoa(encodeURIComponent(json).replace(/%([0-9A-F]{2})/g, (_, p) => String.fromCharCode('0x' + p)));
}
function decodeChallenge(str){
  const json = decodeURIComponent(
    Array.prototype.map.call(atob(str), c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')
  );
  return JSON.parse(json);
}
function buildShareUrl(payload){

}

  if(test === 'timing') scoreLine = `${s.accuracy}% · ${s.score} Punkte`;

  app.innerHTML = `
    <div class="eyebrow">Üben · ${label} · ${mechLabel}</div>

  document.getElementById('practiceExitBtn').onclick = ()=>{ practiceMode = null; renderIntro(); };
}

/* ---------------- TEST 1: REACTION ---------------- */
const REACTION_COLORS = [
  { name: 'GRÜN',  hex: '#C9E4B8' },
  { name: 'BLAU',  hex: '#BFD7EA' },
  { name: 'GELB',  hex: '#F5DE8C' },
  { name: 'LILA',  hex: '#D9C6E8' },
  { name: 'ORANGE', hex: '#F2C29A' },
  { name: 'TÜRKIS', hex: '#B6E0DA' },
];

function renderReaction(){
  if(rulesetCfg().reaction === 'gonogo') return renderReactionGoNoGo();
  if(rulesetCfg().reaction === 'choice') return renderReactionChoice();
  return renderReactionClassic();
}

function renderReactionClassic(){
  const target = REACTION_COLORS[Math.floor(rng() * REACTION_COLORS.length)];

  app.innerHTML = `
    <div class="reaction-zone wait" id="rzone">
      ${rexHTML('focus')}
      <div class="reaction-word" id="rword">WARTEN...</div>
      <div class="reaction-hint">Tippe erst wenn's <strong>${target.name}</strong> wird</div>
    </div>
  `;
  const zone = document.getElementById('rzone');
  const word = document.getElementById('rword');
  let state = 'wait';
  let goTime = 0;
  const delay = 1000 + rng() * 2200;

  const timer = setTimeout(()=>{
    state = 'go';
    zone.classList.remove('wait');
    zone.style.background = target.hex;
    word.textContent = 'JETZT!';
    goTime = performance.now();
  }, delay);

  zone.addEventListener('click', function handler(){
    if(state === 'wait'){
      clearTimeout(timer);
      zone.className = 'reaction-zone early';
      zone.style.background = '';
      word.textContent = 'ZU FRÜH';
      zone.removeEventListener('click', handler);
      setTimeout(renderReaction, 900);
      return;
    }
    if(state === 'go'){
      const ms = Math.round(performance.now() - goTime);
      const [rMin, rMax] = diffCfg().reactionScoreRange;
      scores.reaction = { ms, score: Math.round(mapRange(ms, rMin, rMax, 100, 20)) };
      zone.removeEventListener('click', handler);
      nextTest();
    }
  });
}

function renderReactionGoNoGo(){
  const target = REACTION_COLORS[Math.floor(rng() * REACTION_COLORS.length)];
  const decoys = REACTION_COLORS.filter(c => c.name !== target.name);
  const ROUNDS = 6;
  const stimuli = [];
  for(let i = 0; i < ROUNDS; i++){
    const isGo = rng() < 0.5;
    const color = isGo ? target : decoys[Math.floor(rng() * decoys.length)];
    stimuli.push({ isGo, color });
  }

  app.innerHTML = `
    <div class="reaction-zone wait" id="rzone">
      ${rexHTML('focus')}
      <div class="reaction-word" id="rword">BEREIT</div>
      <div class="reaction-hint">Nur bei <strong>${target.name}</strong> tippen — sonst Finger stillhalten</div>
    </div>
  `;
  const zone = document.getElementById('rzone');
  const word = document.getElementById('rword');
  const STIMULUS_MS = 700;
  const goTimes = [];
  let falseAlarms = 0;
  let misses = 0;
  let round = -1;
  let state = 'idle';
  let stimulusTime = 0;
  let current = null;

  function nextStimulus(){
    round++;
    if(round >= ROUNDS){ finish(); return; }
    state = 'idle';
    zone.className = 'reaction-zone wait';
    zone.style.background = '';
    word.textContent = 'BEREIT';
    setTimeout(showStimulus, 500 + rng() * 500);
  }

  function showStimulus(){
    current = stimuli[round];
    state = 'showing';
    zone.className = 'reaction-zone';
    zone.style.background = current.color.hex;
    word.textContent = current.color.name;
    stimulusTime = performance.now();
    setTimeout(()=>{
      if(state !== 'showing') return;
      if(current.isGo) misses++;
      state = 'gone';
      zone.style.background = '';
      word.textContent = current.isGo ? 'VERPASST' : 'GUT GEHALTEN';
      setTimeout(nextStimulus, 350);
    }, STIMULUS_MS);
  }

  zone.addEventListener('click', ()=>{
    if(state !== 'showing') return;
    if(current.isGo){
      goTimes.push(performance.now() - stimulusTime);
      state = 'hit';
      word.textContent = 'ERFASST';
    } else {
      falseAlarms++;
      state = 'falsealarm';
      zone.className = 'reaction-zone early';
      word.textContent = 'FEHLALARM';
    }
    setTimeout(nextStimulus, 350);
  });

  function finish(){
    const [rMin, rMax] = diffCfg().reactionScoreRange;
    // Go/No-Go braucht Reiz-Klassifikation vor dem Tap — Ausgleich, damit die
    // Klassik-Schwellen (z.B. das Blitzreflex-Achievement) fair vergleichbar bleiben.
    const OVERHEAD_MS = 90;
    const rawAvg = goTimes.length
      ? goTimes.reduce((a, b) => a + b, 0) / goTimes.length
      : rMax + 150 + OVERHEAD_MS;
    const avgMs = Math.max(0, Math.round(rawAvg - OVERHEAD_MS));
    const mapped = Math.round(mapRange(avgMs, rMin, rMax, 100, 20));
    const score = clamp(mapped - falseAlarms * 12 - misses * 8, 0, 100);
    scores.reaction = { ms: avgMs, score };
    nextTest();
  }

  setTimeout(nextStimulus, 300);
}

function renderReactionChoice(){
  const QUAD_COUNT = 4;
  const ROUNDS = 4;
  const TIMEOUT_MS = 1500;

  app.innerHTML = `
    <div class="reaction-choice-wrap">
      <div class="reaction-choice" id="rgrid">
        ${Array.from({length: QUAD_COUNT}, (_, i) => `<div class="reaction-quad" data-idx="${i}"></div>`).join('')}
      </div>
      <div class="reaction-hint" id="choiceHint" style="text-align:center;">Gleich geht's los — tippe das Feld, das aufleuchtet</div>
    </div>
  `;
  const quads = Array.from(document.querySelectorAll('.reaction-quad'));
  const hint = document.getElementById('choiceHint');
  const hitTimes = [];
  let falseTaps = 0;
  let misses = 0;
  let round = -1;
  let state = 'idle';
  let litIdx = -1;
  let litTime = 0;

  function nextRound(){
    round++;
    if(round >= ROUNDS){ finish(); return; }
    state = 'idle';
    quads.forEach(q => q.classList.remove('lit', 'hit'));
    hint.textContent = `Runde ${round + 1} / ${ROUNDS}`;
    setTimeout(lightUp, 500 + rng() * 900);
  }

  function lightUp(){
    litIdx = Math.floor(rng() * QUAD_COUNT);
    state = 'showing';
    quads[litIdx].classList.add('lit');
    litTime = performance.now();
    setTimeout(()=>{
      if(state !== 'showing') return;
      misses++;
      state = 'gone';
      quads[litIdx].classList.remove('lit');
      setTimeout(nextRound, 300);
    }, TIMEOUT_MS);
  }

  quads.forEach(q => {
    q.addEventListener('click', ()=>{
      if(state !== 'showing') return;
      const idx = Number(q.dataset.idx);
      if(idx === litIdx){
        hitTimes.push(performance.now() - litTime);
        state = 'hit';
        quads[litIdx].classList.remove('lit');
        quads[litIdx].classList.add('hit');
        setTimeout(nextRound, 300);
      } else {
        falseTaps++;
      }
    });
  });

  function finish(){
    const [rMin, rMax] = diffCfg().reactionScoreRange;
    // Wahl unter mehreren Zielen braucht mehr Verarbeitung als eine einzelne Zone —
    // Ausgleich, damit die Klassik-Schwellen (z.B. Blitzreflex) fair vergleichbar bleiben.
    const OVERHEAD_MS = 110;
    const rawAvg = hitTimes.length
      ? hitTimes.reduce((a, b) => a + b, 0) / hitTimes.length
      : rMax + 150 + OVERHEAD_MS;
    const avgMs = Math.max(0, Math.round(rawAvg - OVERHEAD_MS));
    const mapped = Math.round(mapRange(avgMs, rMin, rMax, 100, 20));
    const score = clamp(mapped - falseTaps * 12 - misses * 8, 0, 100);
    scores.reaction = { ms: avgMs, score };
    nextTest();
  }

  setTimeout(nextRound, 300);
}

/* ---------------- TEST 2: TIMING ---------------- */
function renderTiming(){
  if(rulesetCfg().timing === 'rhythm') return renderTimingRhythm();
  if(rulesetCfg().timing === 'approach') return renderTimingApproach();
  return renderTimingClassic();
}

function renderTimingClassic(){
  const isMobile = window.matchMedia('(max-width: 480px)').matches;
  app.innerHTML = `
    <div class="eyebrow">Test 2 / 4</div>
    <h1 class="display" style="font-size:22px;">TIMING</h1>
    <p class="sub">${isMobile ? 'Tippe irgendwo auf den Screen, wenn die Nadel in der Zielzone ist.' : 'Stoppe die Nadel in der Zielzone.'}</p>
    <div class="timing-track">
      <div class="timing-target" id="timingTarget"></div>
      <div class="timing-needle" id="needle"></div>
    </div>
    ${isMobile ? '' : '<button class="ghost" id="stopBtn">STOPPEN</button>'}
  `;
  const track = document.querySelector('.timing-track');
  const needle = document.getElementById('needle');
  const zonePct = diffCfg().timingZonePct;
  const targetEl = document.getElementById('timingTarget');
  targetEl.style.width = zonePct + '%';
  targetEl.style.left = ((100 - zonePct) / 2) + '%';
  const trackWidth = track.offsetWidth;
  let pos = 0;
  let dir = 1;
  const speed = diffCfg().timingSpeed;
  let running = true;

  function tick(){
    if(!running) return;
    pos += dir * speed;
    if(pos >= trackWidth - 4){ pos = trackWidth - 4; dir = -1; }
    if(pos <= 0){ pos = 0; dir = 1; }
    needle.style.left = pos + 'px';
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function stop(){
    if(!running) return;
    running = false;
    const center = trackWidth * 0.5;
    const dist = Math.abs(pos - center);
    const accuracy = Math.round(mapRange(dist, 0, trackWidth * 0.5, 100, 0));
    scores.timing = { accuracy, score: accuracy };
    nextTest();
  }

  if(isMobile){
    setTimeout(()=> app.addEventListener('click', stop), 0);
  } else {
    document.getElementById('stopBtn').onclick = stop;
  }
}

function renderTimingRhythm(){
  app.innerHTML = `
    <div class="eyebrow">Test 2 / 4</div>
    <h1 class="display" style="font-size:22px;">TIMING</h1>
    <p class="sub">Tippe im Takt mit — genau wenn der Punkt aufleuchtet.</p>
    <div class="timing-track">
      <div class="timing-beacon" id="beacon"></div>
    </div>
    <div class="reaction-hint" id="beatHint">Bereit...</div>
  `;
  const track = document.querySelector('.timing-track');
  const beacon = document.getElementById('beacon');
  const hint = document.getElementById('beatHint');
  const BEATS = 5;
  const interval = clamp(1000 - diffCfg().timingSpeed * 100, 400, 900);
  const deviations = [];
  let beatIndex = 0;
  let lastBeatTime = 0;
  let waitingForTap = false;

  function pulse(){
    if(beatIndex >= BEATS){ finish(); return; }
    beatIndex++;
    hint.textContent = `Takt ${beatIndex} / ${BEATS}`;
    beacon.classList.add('pulse');
    lastBeatTime = performance.now();
    waitingForTap = true;
    setTimeout(()=>{
      beacon.classList.remove('pulse');
      if(waitingForTap){
        deviations.push(interval * 0.5);
        waitingForTap = false;
      }
      setTimeout(pulse, interval * 0.4);
    }, interval * 0.35);
  }

  track.addEventListener('click', ()=>{
    if(!waitingForTap) return;
    deviations.push(Math.abs(performance.now() - lastBeatTime));
    waitingForTap = false;
  });

  function finish(){
    const avgDev = deviations.reduce((a, b) => a + b, 0) / deviations.length;
    // Menschliches Antippen im Takt hat immer ein paar ms Jitter — quadratisch statt
    // linear abbilden, damit „nahezu perfekt" (Volltreffer-Achievement) erreichbar bleibt.
    const ratio = clamp(avgDev / (interval * 0.5), 0, 1);
    const accuracy = clamp(Math.round(100 * (1 - ratio * ratio)), 0, 100);
    scores.timing = { accuracy, score: accuracy };
    nextTest();
  }

  setTimeout(pulse, 700);
}

function renderTimingApproach(){
  app.innerHTML = `
    <div class="eyebrow">Test 2 / 4</div>
    <h1 class="display" style="font-size:22px;">TIMING</h1>
    <p class="sub">Tippe kurz bevor die Nadel die Linie erreicht — zu spät zählt nicht.</p>
    <div class="timing-track">
      <div class="timing-stopline" id="stopline"></div>
      <div class="timing-needle" id="needle"></div>
    </div>
    <div class="reaction-hint" id="approachHint" style="text-align:center;">Runde 1 / 3</div>
  `;
  const track = document.querySelector('.timing-track');
  const needle = document.getElementById('needle');
  const stopline = document.getElementById('stopline');
  const hint = document.getElementById('approachHint');
  const ROUNDS = 3;
  const LINE_PCT = 0.72;
  const roundScores = [];
  let round = 0;
  let trackWidth = 0;
  let lineX = 0;
  let accelPx = 0;
  let pos = 0;
  let velocity = 0;
  let tapped = false;
  let running = false;

  function startRound(){
    trackWidth = track.offsetWidth;
    lineX = trackWidth * LINE_PCT;
    stopline.style.left = lineX + 'px';
    accelPx = trackWidth * mapRange(diffCfg().timingSpeed, 3.0, 6.0, 0.00045, 0.0011);
    pos = 0;
    velocity = trackWidth * 0.012;
    tapped = false;
    running = true;
    hint.textContent = `Runde ${round + 1} / ${ROUNDS}`;
    needle.style.left = '0px';
    requestAnimationFrame(tick);
  }

  function tick(){
    if(!running) return;
    velocity += accelPx;
    pos += velocity;
    needle.style.left = Math.min(pos, trackWidth - 4) + 'px';
    if(pos >= trackWidth - 4){
      finishRound(false);
      return;
    }
    requestAnimationFrame(tick);
  }

  function finishRound(onTime){
    running = false;
    let roundScore = 0;
    if(onTime){
      // Kleine menschliche Verzögerung beim Antippen quadratisch abfedern, damit
      // „fast perfekt getroffen" (Volltreffer-Achievement) erreichbar bleibt.
      const ratio = clamp((lineX - pos) / (lineX * 0.5), 0, 1);
      roundScore = Math.round(100 * (1 - ratio * ratio));
    }
    roundScores.push(clamp(roundScore, 0, 100));
    round++;
    setTimeout(()=>{
      if(round >= ROUNDS){ finish(); return; }
      startRound();
    }, 500);
  }

  track.addEventListener('click', ()=>{
    if(!running || tapped) return;
    tapped = true;
    finishRound(pos <= lineX);
  });

  function finish(){
    const accuracy = Math.round(roundScores.reduce((a, b) => a + b, 0) / roundScores.length);
    scores.timing = { accuracy, score: accuracy };
    nextTest();
  }

  startRound();
}

/* ---------------- TEST 3: MEMORY ---------------- */
function renderMemory(){
  if(rulesetCfg().memory === 'changedetect') return renderMemoryChangeDetect();
  if(rulesetCfg().memory === 'pairs') return renderMemoryPairs();
  return renderMemoryClassic();
}

function renderMemoryClassic(){
  app.innerHTML = `
    <div class="eyebrow">Test 3 / 4</div>
    <h1 class="display" style="font-size:22px;">GEDÄCHTNIS</h1>
    <p class="sub" id="memSub">Merk dir die Reihenfolge...</p>
    <div class="memory-grid" id="grid"></div>
  `;
  const grid = document.getElementById('grid');
  const sub = document.getElementById('memSub');
  const tiles = [];
  for(let i=0;i<9;i++){
    const t = document.createElement('div');
    t.className = 'memory-tile';
    t.dataset.idx = i;
    grid.appendChild(t);
    tiles.push(t);
  }
  const memoryLength = diffCfg().memoryLength;
  const flashMs = diffCfg().memoryFlashMs;
  const gapMs = diffCfg().memoryGapMs;
  const sequence = [];
  while(sequence.length < memoryLength){
    const idx = Math.floor(rng()*9);
    if(!sequence.includes(idx)) sequence.push(idx);
  }

  let i = 0;
  function flashNext(){
    if(i >= sequence.length){
      sub.textContent = 'Jetzt du: tippe die Reihenfolge nach';
      enableInput();
      return;
    }
    const tile = tiles[sequence[i]];
    tile.classList.add('flash');
    setTimeout(()=>{
      tile.classList.remove('flash');
      i++;
      setTimeout(flashNext, gapMs);
    }, flashMs);
  }
  setTimeout(flashNext, 600);

  function enableInput(){
    let userSeq = [];
    tiles.forEach(t=>{
      t.onclick = ()=>{
        if(userSeq.length >= sequence.length) return;
        t.classList.add('picked');
        userSeq.push(Number(t.dataset.idx));
        if(userSeq.length === sequence.length){
          let correct = 0;
          userSeq.forEach((v,idx)=>{ if(v === sequence[idx]) correct++; });
          scores.memory = { correct, total: sequence.length, score: Math.round((correct/sequence.length)*100) };
          setTimeout(nextTest, 400);
        }
      };
    });
  }
}

function renderMemoryChangeDetect(){
  app.innerHTML = `
    <div class="eyebrow">Test 3 / 4</div>
    <h1 class="display" style="font-size:22px;">GEDÄCHTNIS</h1>
    <p class="sub" id="memSub">Merk dir das Muster...</p>
    <div class="memory-grid" id="grid"></div>
  `;
  const grid = document.getElementById('grid');
  const sub = document.getElementById('memSub');
  const tiles = [];
  for(let i=0;i<9;i++){
    const t = document.createElement('div');
    t.className = 'memory-tile';
    t.dataset.idx = i;
    grid.appendChild(t);
    tiles.push(t);
  }
  const memoryLength = diffCfg().memoryLength;
  const flashMs = diffCfg().memoryFlashMs;
  const gapMs = diffCfg().memoryGapMs;
  const changeCount = clamp(Math.round(memoryLength * 0.6), 1, Math.min(memoryLength, 9 - memoryLength));

  const allIdx = Array.from({length: 9}, (_, i) => i);
  const pattern1 = [];
  while(pattern1.length < memoryLength){
    const idx = Math.floor(rng() * 9);
    if(!pattern1.includes(idx)) pattern1.push(idx);
  }
  const pool1 = [...pattern1];
  const removed = [];
  while(removed.length < changeCount){
    removed.push(pool1.splice(Math.floor(rng() * pool1.length), 1)[0]);
  }
  const pool2 = allIdx.filter(i => !pattern1.includes(i));
  const added = [];
  while(added.length < changeCount){
    added.push(pool2.splice(Math.floor(rng() * pool2.length), 1)[0]);
  }
  const pattern2 = pattern1.filter(i => !removed.includes(i)).concat(added);

  function showPattern(indices){
    tiles.forEach(t => t.classList.remove('flash'));
    indices.forEach(i => tiles[i].classList.add('flash'));
  }

  showPattern(pattern1);
  setTimeout(()=>{
    showPattern([]);
    sub.textContent = 'Und jetzt...';
    setTimeout(()=>{
      showPattern(pattern2);
      sub.textContent = `Welche ${changeCount} Felder sind neu dazugekommen?`;
      enableInput();
    }, gapMs);
  }, flashMs * 2 + memoryLength * 120);

  function enableInput(){
    const userSeq = [];
    tiles.forEach(t=>{
      t.onclick = ()=>{
        const idx = Number(t.dataset.idx);
        if(userSeq.length >= changeCount || userSeq.includes(idx)) return;
        t.classList.add('picked');
        userSeq.push(idx);
        if(userSeq.length === changeCount){
          const correct = userSeq.filter(v => added.includes(v)).length;
          scores.memory = { correct, total: changeCount, score: Math.round((correct / changeCount) * 100) };
          setTimeout(nextTest, 400);
        }
      };
    });
  }
}

function renderMemoryPairs(){
  app.innerHTML = `
    <div class="eyebrow">Test 3 / 4</div>
    <h1 class="display" style="font-size:22px;">GEDÄCHTNIS</h1>
    <p class="sub" id="pairsSub">Merk dir, wo welches Paar liegt...</p>
    <div class="memory-grid pairs-grid" id="pairsGrid"></div>
  `;
  const grid = document.getElementById('pairsGrid');
  const sub = document.getElementById('pairsSub');
  const memoryLength = diffCfg().memoryLength;
  const flashMs = diffCfg().memoryFlashMs;
  const pairsCount = clamp(Math.round(memoryLength * 0.8), 2, 6);

  const deck = [];
  for(let i = 0; i < pairsCount; i++){ deck.push(i, i); }
  for(let i = deck.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }

  const tiles = deck.map((symbol, idx) => {
    const t = document.createElement('div');
    t.className = 'memory-tile pairs-tile';
    t.dataset.idx = idx;
    t.dataset.symbol = symbol;
    grid.appendChild(t);
    return t;
  });

  function showTile(t){
    t.classList.add('flash');
    t.textContent = Number(t.dataset.symbol) + 1;
  }
  function hideTile(t){
    t.classList.remove('flash');
    t.textContent = '';
  }

  tiles.forEach(showTile);
  const viewMs = flashMs + pairsCount * 220;
  setTimeout(()=>{
    tiles.forEach(hideTile);
    sub.textContent = 'Und jetzt: finde die Paare';
    enableInput();
  }, viewMs);

  function enableInput(){
    let correctPairs = 0;
    let attemptsLeft = pairsCount + 2;
    let first = null;
    let busy = false;

    function finish(){
      tiles.forEach(t => { t.onclick = null; });
      scores.memory = { correct: correctPairs, total: pairsCount, score: Math.round((correctPairs / pairsCount) * 100) };
      setTimeout(nextTest, 500);
    }

    tiles.forEach(t=>{
      t.onclick = ()=>{
        if(busy || t.classList.contains('picked') || t === first) return;
        showTile(t);
        if(!first){
          first = t;
          return;
        }
        busy = true;
        const match = first.dataset.symbol === t.dataset.symbol;
        attemptsLeft--;
        if(match){
          correctPairs++;
          first.classList.add('picked');
          t.classList.add('picked');
          first = null;
          busy = false;
          if(correctPairs === pairsCount || attemptsLeft <= 0) finish();
        } else {
          const a = first, b = t;
          setTimeout(()=>{
            hideTile(a);
            hideTile(b);
            first = null;
            busy = false;
            if(attemptsLeft <= 0) finish();
          }, 700);
        }
      };
    });
  }
}

function renderPrecision(){

  if(rulesetCfg().precision === 'steady') return renderPrecisionSteady();

function renderPrecisionClassic(){
  app.innerHTML = `
    <div class="eyebrow">Test 4 / 4</div>
    <h1 class="display" style="font-size:22px;">PRÄZISION</h1>
    <p class="sub">Triff die Mitte der 3 Ziele.</p>
    <div class="precision-field" id="field"></div>
  `;
  const field = document.getElementById('field');
  const fieldRect = () => ({ width: field.offsetWidth, height: field.offsetHeight });
  let round = 0;
  const results = [];
  const isMobilePrecision = window.matchMedia('(max-width: 480px)').matches;
  const SIZE_START = isMobilePrecision ? diffCfg().precisionSize.mobile : diffCfg().precisionSize.desktop;
  const TARGET_TIMEOUT_MS = diffCfg().precisionTimeoutMs;

  function spawnTarget(){
    const size = SIZE_START;
    const rect = fieldRect();
    const maxX = rect.width - size - 10;
    const maxY = rect.height - size - 10;
    const x = 10 + rng() * Math.max(maxX, 10);
    const y = 10 + rng() * Math.max(maxY, 10);

    const target = document.createElement('div');
    target.className = 'precision-target';
    target.style.width = size + 'px';
    target.style.height = size + 'px';
    target.style.left = x + 'px';
    target.style.top = y + 'px';
    target.style.transition = 'width 1.1s linear, height 1.1s linear, left 1.1s linear, top 1.1s linear';
    field.appendChild(target);

    requestAnimationFrame(()=>{
      const shrink = size * 0.35;
      target.style.width = shrink + 'px';
      target.style.height = shrink + 'px';
      target.style.left = (x + (size-shrink)/2) + 'px';
      target.style.top = (y + (size-shrink)/2) + 'px';
    });

    let clicked = false;
    const timeout = setTimeout(()=>{
      if(clicked) return;
      clicked = true;
      results.push(0);
      target.remove();
      advance();
    }, TARGET_TIMEOUT_MS);

    target.onclick = (e)=>{
      if(clicked) return;
      clicked = true;
      clearTimeout(timeout);
      const tRect = target.getBoundingClientRect();
      const cx = tRect.left + tRect.width/2;
      const cy = tRect.top + tRect.height/2;
      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const acc = Math.round(mapRange(dist, 0, tRect.width, 100, 0));
      results.push(clamp(acc,0,100));
      target.remove();
      advance();
    };
  }

  function advance(){
    round++;
    if(round >= 3){
      const avg = Math.round(results.reduce((a,b)=>a+b,0)/results.length);
      scores.precision = { score: avg };
      nextTest();
    } else {
      setTimeout(spawnTarget, 250);
    }
  }
  spawnTarget();
}

function renderPrecisionTracking(){
  app.innerHTML = `
    <div class="eyebrow">Test 4 / 4</div>
    <h1 class="display" style="font-size:22px;">PRÄZISION</h1>
    <p class="sub">Verfolge das Ziel so genau wie möglich.</p>
    <div class="precision-field" id="field">
      <div class="precision-target" id="ptarget"></div>
      <div class="precision-cursor" id="pcursor"></div>
    </div>
  `;
  const field = document.getElementById('field');
  const target = document.getElementById('ptarget');
  const cursor = document.getElementById('pcursor');
  const isMobilePrecision = window.matchMedia('(max-width: 480px)').matches;
  const size = isMobilePrecision ? diffCfg().precisionSize.mobile * 0.6 : diffCfg().precisionSize.desktop * 0.8;
  const cursorSize = size * 0.4;
  target.style.width = size + 'px';
  target.style.height = size + 'px';
  cursor.style.width = cursorSize + 'px';
  cursor.style.height = cursorSize + 'px';

  const ROUND_MS = 5000;
  const speed = mapRange(diffCfg().precisionTimeoutMs, 800, 1500, 3.4, 1.6);
  const fieldRect = () => field.getBoundingClientRect();
  const rect0 = fieldRect();
  let x = rng() * Math.max(rect0.width - size, 10);
  let y = rng() * Math.max(rect0.height - size, 10);
  let dx = speed, dy = speed * 0.8;
  let pointerX = null, pointerY = null;
  const distances = [];
  let running = true;

  function updatePointer(clientX, clientY){
    const rect = fieldRect();
    pointerX = clientX - rect.left;
    pointerY = clientY - rect.top;
  }
  function onMouseMove(e){ updatePointer(e.clientX, e.clientY); }
  function onTouchMove(e){
    if(!e.touches.length) return;
    e.preventDefault();
    updatePointer(e.touches[0].clientX, e.touches[0].clientY);
  }
  field.addEventListener('mousemove', onMouseMove);
  field.addEventListener('touchmove', onTouchMove, { passive: false });

  function tick(){
    if(!running) return;
    const rect = fieldRect();
    const maxX = rect.width - size;
    const maxY = rect.height - size;
    x += dx; y += dy;
    if(x <= 0){ x = 0; dx *= -1; }
    if(x >= maxX){ x = maxX; dx *= -1; }
    if(y <= 0){ y = 0; dy *= -1; }
    if(y >= maxY){ y = maxY; dy *= -1; }
    target.style.left = x + 'px';
    target.style.top = y + 'px';
    if(pointerX !== null){
      cursor.style.left = (pointerX - cursorSize / 2) + 'px';
      cursor.style.top = (pointerY - cursorSize / 2) + 'px';
      cursor.style.opacity = '1';
      const dist = Math.hypot(pointerX - (x + size / 2), pointerY - (y + size / 2));
      distances.push(dist);
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  setTimeout(()=>{
    running = false;
    field.removeEventListener('mousemove', onMouseMove);
    field.removeEventListener('touchmove', onTouchMove);
    const avgDist = distances.length ? distances.reduce((a, b) => a + b, 0) / distances.length : size * 2;
    const score = clamp(Math.round(mapRange(avgDist, 0, size * 1.5, 100, 0)), 0, 100);
    scores.precision = { score };
    nextTest();
  }, ROUND_MS);
}

function renderPrecisionSteady(){
  app.innerHTML = `
    <div class="eyebrow">Test 4 / 4</div>
    <h1 class="display" style="font-size:22px;">PRÄZISION</h1>
    <p class="sub">Bleib mit dem Zeiger in der Zone — sie wird enger.</p>
    <div class="precision-field" id="field">
      <div class="precision-ring" id="pring"></div>
    </div>
  `;
  const field = document.getElementById('field');
  const ring = document.getElementById('pring');
  const isMobilePrecision = window.matchMedia('(max-width: 480px)').matches;
  const startSize = isMobilePrecision ? diffCfg().precisionSize.mobile * 0.9 : diffCfg().precisionSize.desktop * 1.3;
  const minSize = startSize * 0.35;
  const ROUND_MS = 4500;

  const fieldRect = () => field.getBoundingClientRect();
  const rect0 = fieldRect();
  const subRect = document.querySelector('.sub').getBoundingClientRect();
  const margin = startSize / 2 + 10;
  const safeTop = Math.max(margin, subRect.bottom - rect0.top + margin);
  const safeBottom = Math.max(rect0.height - margin, safeTop + 10);
  const cx = margin + rng() * Math.max(rect0.width - margin * 2, 10);
  const cy = safeTop + rng() * (safeBottom - safeTop);

  let pointerX = null, pointerY = null;
  let insideMs = 0;
  let lastFrame = null;
  let running = true;
  const startTime = performance.now();

  function updatePointer(clientX, clientY){
    const rect = fieldRect();
    pointerX = clientX - rect.left;
    pointerY = clientY - rect.top;
  }
  function onMouseMove(e){ updatePointer(e.clientX, e.clientY); }
  function onTouchMove(e){
    if(!e.touches.length) return;
    e.preventDefault();
    updatePointer(e.touches[0].clientX, e.touches[0].clientY);
  }
  field.addEventListener('mousemove', onMouseMove);
  field.addEventListener('touchmove', onTouchMove, { passive: false });

  function tick(now){
    if(!running) return;
    if(lastFrame === null) lastFrame = now;
    const dt = now - lastFrame;
    lastFrame = now;
    const elapsed = now - startTime;
    const progress = clamp(elapsed / ROUND_MS, 0, 1);
    const size = startSize + (minSize - startSize) * progress;
    ring.style.width = size + 'px';
    ring.style.height = size + 'px';
    ring.style.left = (cx - size / 2) + 'px';
    ring.style.top = (cy - size / 2) + 'px';

    const inside = pointerX !== null && Math.hypot(pointerX - cx, pointerY - cy) <= size / 2;
    ring.classList.toggle('inside', inside);
    if(inside) insideMs += dt;

    if(elapsed >= ROUND_MS){
      finish();
      return;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function finish(){
    running = false;
    field.removeEventListener('mousemove', onMouseMove);
    field.removeEventListener('touchmove', onTouchMove);
    const score = clamp(Math.round((insideMs / ROUND_MS) * 100), 0, 100);
    scores.precision = { score };
    nextTest();
  }
}

function diagnosisFor(score){
  const pick = (arr) => arr[Math.floor(rng() * arr.length)];
  if(score >= 90) return pick(DIAGNOSES.s90);
  if(score >= 75) return pick(DIAGNOSES.s75);
  if(score >= 55) return pick(DIAGNOSES.s55);
  if(score >= 35) return pick(DIAGNOSES.s35);
  return pick(DIAGNOSES.s0);
}

const PLAYED_DIFFS_KEY = 'reflexlab_played_diffs';
function readPlayedDifficulties(){
  try{
    const data = JSON.parse(localStorage.getItem(PLAYED_DIFFS_KEY));
    if(Array.isArray(data)) return data;
  }catch(err){ /* fällt durch zum Standardwert */ }
  return [];
}
function recordPlayedDifficulty(diff){
  const played = readPlayedDifficulties();
  if(!played.includes(diff)){
    played.push(diff);
    localStorage.setItem(PLAYED_DIFFS_KEY, JSON.stringify(played));

  return played;
}

    if(ok){
      showToast('Ergebnis kopiert ✓');
    } else {
      showLinkFallback(fullShareText);
    }
  };
}

/* ---------------- REX MASKOTTCHEN (Canvas) ---------------- */
const REX_CANVAS_COLORS = {
  ink: '#16221F',
  inkSoft: '#4A5A55',
  deviceEdge: '#0D1211',
  signal: '#E2412C',
  signalDim: '#F3C8C2',
  yellow: '#F2B705',
};

function drawRexOnCanvas(ctx, centerX, topY, state){
  const P = 9;
  const x0 = centerX - (18 * P) / 2;
  const y0 = topY;
  const stateColor = state === 'record' ? REX_CANVAS_COLORS.yellow
    : state === 'slow' ? REX_CANVAS_COLORS.inkSoft
    : REX_CANVAS_COLORS.signal;

  const rect = (gx, gy, gw, gh, color)=>{
    ctx.fillStyle = color;
    ctx.fillRect(x0 + gx * P, y0 + gy * P, gw * P, gh * P);
  };

  // floor shadow
  ctx.fillStyle = 'rgba(22,34,31,0.12)';
  ctx.beginPath();
  ctx.ellipse(x0 + 9 * P, y0 + 19.5 * P, 5 * P, 1 * P, 0, 0, Math.PI * 2);
  ctx.fill();

  // antenna (droops for "zu langsam")
  ctx.save();
  if(state === 'slow'){
    ctx.translate(x0 + 9 * P, y0 + 4 * P);
    ctx.rotate(50 * Math.PI / 180);
    ctx.fillStyle = REX_CANVAS_COLORS.inkSoft;
    ctx.fillRect(-0.5 * P, -3.5 * P, 1 * P, 3 * P);
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = stateColor;
    ctx.fillRect(-1.5 * P, -4.5 * P, 3 * P, 2 * P);
    ctx.globalAlpha = 1;
  } else {
    rect(8.5, 1, 1, 3, REX_CANVAS_COLORS.inkSoft);
    ctx.shadowColor = stateColor;
    ctx.shadowBlur = state === 'record' ? 18 : 10;
    rect(7.5, 0, 3, 2, stateColor);
    ctx.shadowBlur = 0;
  }
  ctx.restore();

  // ears
  rect(0, 7, 2, 6, REX_CANVAS_COLORS.ink);
  rect(16, 7, 2, 6, REX_CANVAS_COLORS.ink);

  // head
  rect(2, 4, 14, 11, REX_CANVAS_COLORS.ink);
  ctx.strokeStyle = REX_CANVAS_COLORS.deviceEdge;
  ctx.lineWidth = P;
  ctx.strokeRect(x0 + 2 * P, y0 + 4 * P, 14 * P, 11 * P);

  // faceplate
  rect(3, 6, 12, 8, REX_CANVAS_COLORS.deviceEdge);

  // brow
  const browY = state === 'record' ? 6.3 : state === 'slow' ? 8 : 6.7;
  rect(4, browY, 4, 1, REX_CANVAS_COLORS.inkSoft);

  // eye
  ctx.shadowColor = stateColor;
  ctx.shadowBlur = state === 'slow' ? 0 : 14;
  ctx.globalAlpha = state === 'slow' ? 0.55 : 1;
  if(state === 'record'){
    rect(7, 7.3, 4, 4, stateColor);
  } else if(state === 'slow'){
    rect(7, 9, 4, 1, stateColor);
  } else {
    rect(7, 8, 4, 3, stateColor);
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  if(state !== 'slow'){
    rect(7, state === 'record' ? 7.3 : 8, 1, 1, REX_CANVAS_COLORS.signalDim);
  }

  // mouth
  if(state === 'record'){
    rect(9.5, 12, 4, 2, REX_CANVAS_COLORS.inkSoft);
    rect(9.5, 12, 4, 1, REX_CANVAS_COLORS.deviceEdge);
  } else if(state === 'slow'){
    ctx.save();
    ctx.translate(x0 + 11 * P, y0 + 13 * P);
    ctx.rotate(8 * Math.PI / 180);
    ctx.fillStyle = REX_CANVAS_COLORS.inkSoft;
    ctx.fillRect(-1.5 * P, -0.5 * P, 3 * P, 1 * P);
    ctx.restore();
  } else {
    rect(11, 13, 3, 1, REX_CANVAS_COLORS.inkSoft);
  }

  // bolt
  rect(13, 6, 1, 1, REX_CANVAS_COLORS.inkSoft);

  // neck
  rect(7, 15, 4, 1, REX_CANVAS_COLORS.deviceEdge);

  // feet
  const footShift = state === 'slow' ? 1 : 0;
  rect(2 + footShift, 16, 6, 4, REX_CANVAS_COLORS.ink);
  rect(10 - footShift, 16, 6, 4, REX_CANVAS_COLORS.ink);

  // sparks for "neuer rekord"
  if(state === 'record'){
    ctx.fillStyle = REX_CANVAS_COLORS.yellow;
    ctx.shadowColor = REX_CANVAS_COLORS.yellow;
    ctx.shadowBlur = 14;
    [[1.5, 3], [16, 4], [17, 10]].forEach(([gx, gy])=>{
      ctx.fillRect(x0 + gx * P, y0 + gy * P, P, P);
    });
    ctx.shadowBlur = 0;
  }
}

/* ---------------- SHARE CARD (Canvas) ---------------- */
function buildCardCanvas(data){
  const { overall, diag, r, t, m, p, diffLabel, achievements = [], nickname = '', rexState = 'neutral' } = data;
  const W = 640;
  const REX_TOP = 210;
  const cardH = 900 + (achievements.length ? 110 : 0);
  const H = REX_TOP + cardH;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // paper background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  drawRexOnCanvas(ctx, W / 2, 20, rexState);

  ctx.save();
  ctx.translate(0, REX_TOP);

  // subtle top strip
  ctx.fillStyle = '#EDF1EC';
  ctx.fillRect(0, 0, W, 64);

  const centerX = W / 2;
  ctx.textAlign = 'center';

  ctx.fillStyle = '#4A5A55';
  ctx.font = '700 15px "Space Mono", monospace';
  ctx.fillText(`REFLEX LAB · TAGES-CHALLENGE · ${diffLabel}`, centerX, 40);

  if(nickname){
    ctx.fillStyle = '#4A5A55';
    ctx.font = '700 13px "Space Mono", monospace';
    ctx.fillText(nickname.toUpperCase(), centerX, 88);
    ctx.fillStyle = '#16221F';
    ctx.font = '700 15px "Space Mono", monospace';
    ctx.fillText(new Date().toLocaleDateString('de-DE'), centerX, 112);
  } else {
    ctx.fillStyle = '#16221F';
    ctx.font = '700 17px "Space Mono", monospace';
    ctx.fillText(new Date().toLocaleDateString('de-DE'), centerX, 105);
  }

  dashedLine(ctx, 40, 130, W - 40, 130);

  ctx.fillStyle = '#E2412C';
  ctx.font = '700 24px Inter, sans-serif';
  ctx.fillText(diag.title, centerX, 180);

  ctx.fillStyle = '#16221F';
  ctx.font = '900 130px "Archivo Black", sans-serif';
  ctx.fillText(String(overall), centerX, 320);

  ctx.fillStyle = '#4A5A55';
  ctx.font = '400 15px Inter, sans-serif';
  ctx.fillText(diag.note, centerX, 360);

  dashedLine(ctx, 40, 400, W - 40, 400);

  const rows = [
    ['REAKTION', r.ms + 'ms'],
    ['TIMING', t.accuracy + '%'],
    ['GEDÄCHTNIS', m.correct + '/' + m.total],
    ['PRÄZISION', p.score + '%'],
  ];
  ctx.font = '700 20px "Space Mono", monospace';
  let y = 445;
  rows.forEach(([label, val])=>{
    ctx.textAlign = 'left';
    ctx.fillStyle = '#4A5A55';
    ctx.fillText(label, 60, y);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#16221F';
    ctx.fillText(val, W - 60, y);
    y += 42;
  });

  let contentY = y + 10;
  dashedLine(ctx, 40, contentY, W - 40, contentY);

  if(achievements.length){
    contentY = drawBadges(ctx, achievements, contentY + 32, W);
    dashedLine(ctx, 40, contentY, W - 40, contentY);
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#4A5A55';
  ctx.font = '400 13px "Space Mono", monospace';
  ctx.fillText('ENDE DER PRÜFUNG', centerX, contentY + 35);

  ctx.fillStyle = '#16221F';
  ctx.font = '700 16px Inter, sans-serif';
  ctx.fillText('Schlag das Ergebnis 👉', centerX, cardH - 60);

  // torn edge effect at bottom
  ctx.fillStyle = '#EDF1EC';
  const teeth = 20;
  const toothWidth = W / teeth;
  ctx.beginPath();
  ctx.moveTo(0, cardH);
  for(let i = 0; i <= teeth; i++){
    const x = i * toothWidth;
    ctx.lineTo(x, cardH - (i % 2 === 0 ? 14 : 0));
  }
  ctx.lineTo(W, cardH);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
  return canvas;
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBadges(ctx, badges, startY, W){
  const padX = 40;
  const maxWidth = W - padX * 2;
  const gap = 10;
  const pillHeight = 34;
  const lineGap = 10;

  ctx.font = '700 15px "Space Mono", monospace';
  const items = badges.map(b => {
    const text = `${b.icon} ${b.label}`;
    return { text, w: ctx.measureText(text).width + 24 };
  });

  const rows = [];
  let currentRow = [];
  let currentWidth = 0;
  items.forEach(item => {
    if(currentRow.length && currentWidth + gap + item.w > maxWidth){
      rows.push(currentRow);
      currentRow = [];
      currentWidth = 0;
    }
    currentRow.push(item);
    currentWidth += (currentRow.length > 1 ? gap : 0) + item.w;
  });
  if(currentRow.length) rows.push(currentRow);

  let y = startY;
  rows.forEach(row => {
    const rowWidth = row.reduce((sum, item) => sum + item.w, 0) + gap * (row.length - 1);
    let x = (W - rowWidth) / 2;
    row.forEach(item => {
      ctx.fillStyle = '#F2B705';
      roundRect(ctx, x, y, item.w, pillHeight, pillHeight / 2);
      ctx.fill();
      ctx.fillStyle = '#16221F';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(item.text, x + 12, y + pillHeight / 2 + 1);
      x += item.w + gap;
    });
    y += pillHeight + lineGap;
  });

  ctx.textBaseline = 'alphabetic';
  return y;
}

function dashedLine(ctx, x1, y, x2, y2){
  ctx.save();
  ctx.strokeStyle = '#c9c9c9';
  ctx.setLineDash([6, 5]);
  ctx.beginPath();
  ctx.moveTo(x1, y);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.restore();
}

async function shareCard(data){
  showToast('Karte wird erstellt...');
  // give fonts a beat to be ready
  if(document.fonts && document.fonts.ready){ await document.fonts.ready; }
  const canvas = buildCardCanvas(data);

  canvas.toBlob(async (blob)=>{
    if(!blob){ showToast('Karte konnte nicht erstellt werden'); return; }
    const file = new File([blob], 'reflex-lab-ergebnis.png', { type: 'image/png' });

    if(navigator.canShare && navigator.canShare({ files: [file] })){
      try{
        await navigator.share({
          files: [file],
          title: 'Reflex Lab Ergebnis',
          text: data.shareText,
        });
        return;
      }catch(err){
        // user cancelled or share failed — fall through to download
      }
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'reflex-lab-ergebnis.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Karte heruntergeladen ✓');
  }, 'image/png');
}

renderIntro();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js');
}
