<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>REFLEX LAB — Test dein Nervensystem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EDF1EC;
    --paper-dim: #DCE4DD;
    --ink: #16221F;
    --ink-soft: #4A5A55;
    --signal: #E2412C;
    --signal-dim: #F3C8C2;
    --teal: #3F6D66;
    --yellow: #F2B705;
    --device: #1C2523;
    --device-edge: #0D1211;
    --screen-glow: 0 0 0 1px rgba(0,0,0,0.05) inset;
    --font-display: 'Archivo Black', sans-serif;
    --font-mono: 'Space Mono', monospace;
    --font-body: 'Inter', sans-serif;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; height:100%;
    background: var(--device-edge);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.03), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(255,255,255,0.03), transparent 40%);
    font-family: var(--font-body);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  #stage{
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px 16px;
  }

  #device{
    width: 100%;
    max-width: 420px;
    background: linear-gradient(160deg, #232F2C, #171F1D);
    border-radius: 32px;
    padding: 18px 18px 26px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.6),
      0 0 0 1px rgba(255,255,255,0.04) inset;
  }

  #device-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 4px 8px 14px;
  }

  #device-label{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: rgba(237,241,236,0.5);
    text-transform: uppercase;
  }

  #device-dot{
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--signal);
    box-shadow: 0 0 8px 1px rgba(226,65,44,0.7);
  }

  #screen{
    position: relative;
    background: var(--paper);
    border-radius: 18px;
    min-height: 520px;
    box-shadow: var(--screen-glow);
    overflow: hidden;
    display:flex;
    flex-direction: column;
  }

  @media (max-width: 480px){
    #stage{ padding: 12px; }
    #device{ max-width: 100%; }
    #screen{
      min-height: calc(100vh - 110px);
      min-height: calc(100dvh - 110px);
    }
  }

  .screen-inner{
    flex:1;
    display:flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    text-align:center;
    height: 100%;
    width: 100%;
  }

  /* ---------- Typography ---------- */
  h1.display{
    font-family: var(--font-display);
    font-size: 30px;
    line-height: 1.05;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .eyebrow{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--signal);
    margin-bottom: 10px;
    font-weight: 700;
  }

  p.sub{
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink-soft);
    margin: 0 0 28px;
    max-width: 280px;
  }

  /* ---------- Buttons ---------- */
  button{
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 15px;
    border: none;
    cursor: pointer;
    border-radius: 10px;
    padding: 16px 28px;
    background: var(--ink);
    color: var(--paper);
    transition: transform 0.08s ease;
  }
  button:active{ transform: scale(0.96); }
  button.ghost{
    background: transparent;
    color: var(--ink);
    box-shadow: 0 0 0 2px var(--ink) inset;
  }
  button.signal{ background: var(--signal); color: var(--paper); }

  /* ---------- Challenge stats ---------- */
  .challenge-stats{
    font-family: var(--font-mono);
    font-size: 12px;
    width: 100%;
    max-width: 220px;
    margin: -12px 0 24px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .challenge-stats .row{
    display:flex; justify-content: space-between;
    color: var(--ink-soft);
  }
  .challenge-stats .row span:last-child{
    color: var(--ink);
    font-weight: 700;
  }

  /* ---------- Progress dots ---------- */
  #progress{
    position:absolute;
    top: 16px; left: 0; right:0;
    display:flex;
    gap: 6px;
    justify-content:center;
    z-index: 5;
  }
  .prog-dot{
    width: 22px; height: 4px; border-radius: 2px;
    background: var(--paper-dim);
  }
  .prog-dot.done{ background: var(--teal); }
  .prog-dot.active{ background: var(--signal); }

  /* ---------- Reaction test ---------- */
  .reaction-zone{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    transition: background 0.15s ease;
  }
  .reaction-zone.wait{ background: var(--signal-dim); }
  .reaction-zone.go{ background: #C9E4B8; }
  .reaction-zone.early{ background: var(--signal); }
  .reaction-word{
    font-family: var(--font-display);
    font-size: 28px;
    color: var(--ink);
  }
  .reaction-hint{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 8px;
  }

  /* ---------- Timing test ---------- */
  .timing-track{
    position: relative;
    width: 100%;
    height: 54px;
    background: var(--paper-dim);
    border-radius: 8px;
    margin: 18px 0 30px;
    overflow: hidden;
  }
  .timing-target{
    position: absolute;
    top: 0; bottom: 0;
    width: 18%;
    left: 41%;
    background: rgba(63,109,102,0.25);
    border-left: 2px dashed var(--teal);
    border-right: 2px dashed var(--teal);
  }
  .timing-needle{
    position: absolute;
    top: 0; bottom: 0;
    width: 4px;
    background: var(--signal);
  }

  /* ---------- Memory test ---------- */
  .memory-grid{
    display:grid;
    grid-template-columns: repeat(3, 64px);
    gap: 10px;
    margin: 10px 0 24px;
  }
  .memory-tile{
    width: 64px; height: 64px;
    background: var(--paper-dim);
    border-radius: 12px;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .memory-tile.flash{ background: var(--yellow); }
  .memory-tile.picked{ background: var(--teal); }
  .memory-tile:active{ transform: scale(0.94); }

  /* ---------- Precision test ---------- */
  .precision-field{
    position: absolute; inset: 0;
  }
  .precision-target{
    position: absolute;
    border-radius: 50%;
    background: var(--signal);
    box-shadow: 0 0 0 6px rgba(226,65,44,0.15);
  }

  /* ---------- Result receipt ---------- */
  .receipt{
    width: 100%;
    max-width: 260px;
    background: #fff;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 12.5px;
    line-height: 1.7;
    padding: 20px 18px 26px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    position: relative;
  }
  .receipt::after{
    content: "";
    position: absolute;
    left:0; right:0; bottom: -9px;
    height: 18px;
    background:
      linear-gradient(-45deg, #fff 8px, transparent 0),
      linear-gradient(45deg, #fff 8px, transparent 0);
    background-size: 16px 16px;
    background-repeat: repeat-x;
  }
  .receipt-title{
    font-family: var(--font-display);
    font-size: 15px;
    text-align:center;
    margin-bottom: 4px;
  }
  .receipt-sub{
    text-align:center;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }
  .receipt hr{
    border:none; border-top: 1px dashed #c9c9c9; margin: 10px 0;
  }
  .receipt-row{
    display:flex; justify-content: space-between;
  }
  .receipt-score{
    text-align:center;
    font-family: var(--font-display);
    font-size: 44px;
    margin: 8px 0 0;
  }
  .receipt-diagnosis{
    text-align:center;
    font-size: 13px;
    font-weight: 700;
    color: var(--signal);
    margin-bottom: 4px;
    font-family: var(--font-body);
  }

  .result-actions{
    display:flex; gap: 10px; margin-top: 22px;
  }

  .toast{
    position:absolute;
    bottom: 14px; left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--paper);
    font-size: 12px;
    padding: 8px 14px;
    border-radius: 8px;
    opacity: 0;
    pointer-events:none;
    transition: opacity 0.2s ease;
    font-family: var(--font-mono);
  }
  .toast.show{ opacity: 1; }

  .link-fallback{
    position:absolute; inset:0;
    background: rgba(22,34,31,0.6);
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
    z-index: 30;
  }
  .link-fallback-box{
    background: #fff;
    border-radius: 14px;
    padding: 20px;
    width: 100%;
    max-width: 280px;
    text-align:center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  }
  .link-fallback-box p{
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 12px;
  }
  .link-fallback-input{
    width: 100%;
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 10px;
    border: 1px solid var(--paper-dim);
    border-radius: 8px;
    background: var(--paper);
    color: var(--ink);
    margin-bottom: 14px;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="device">
    <div id="device-header">
      <div id="device-label">REFLEX LAB · MODELL RX-4</div>
      <div id="device-dot"></div>
    </div>
    <div id="screen">
      <div id="progress"></div>
      <div class="screen-inner" id="app"></div>
      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>

<script>
const app = document.getElementById('app');
const progressEl = document.getElementById('progress');
const toastEl = document.getElementById('toast');

const TESTS = ['reaction','timing','memory','precision'];
let currentTestIndex = -1;
let scores = {};

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=> toastEl.classList.remove('show'), 1600);
}

async function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){
    try{
      await navigator.clipboard.writeText(text);
      return true;
    }catch(err){ /* fällt durch zum Legacy-Fallback */ }
  }
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if(ok) return true;
  }catch(err){ /* fällt durch zum manuellen Fallback */ }
  return false;
}

function showLinkFallback(text){
  const wrap = document.querySelector('.screen-inner').parentElement;
  const overlay = document.createElement('div');
  overlay.className = 'link-fallback';
  overlay.innerHTML = `
    <div class="link-fallback-box">
      <p>Automatisches Kopieren war hier nicht möglich — markiere den Link und kopiere ihn manuell:</p>
      <input class="link-fallback-input" id="fallbackInput" value="${text.replace(/"/g, '&quot;')}" readonly>
      <button class="signal" id="fallbackClose">Fertig</button>
    </div>
  `;
  wrap.appendChild(overlay);
  const input = document.getElementById('fallbackInput');
  input.focus();
  input.select();
  document.getElementById('fallbackClose').onclick = ()=> overlay.remove();
}

function renderProgress(){
  progressEl.innerHTML = '';
  if(currentTestIndex < 0) return;
  TESTS.forEach((t, i)=>{
    const d = document.createElement('div');
    d.className = 'prog-dot' + (i < currentTestIndex ? ' done' : i === currentTestIndex ? ' active' : '');
    progressEl.appendChild(d);
  });
}

function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function mapRange(v, inMin, inMax, outMin, outMax){
  const t = clamp((v - inMin) / (inMax - inMin), 0, 1);
  return outMin + t * (outMax - outMin);
}

/* ---------------- DAILY SEED ---------------- */
function mulberry32(seed){
  let a = seed;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function dateSeed(){
  const s = new Date().toISOString().slice(0, 10); // YYYY-MM-DD, gleich für alle
  let h = 0;
  for(let i = 0; i < s.length; i++){ h = Math.imul(31, h) + s.charCodeAt(i) | 0; }
  return h;
}
const todayLabel = new Date().toLocaleDateString('de-DE');
let rng = mulberry32(dateSeed());
function resetDailyRng(){ rng = mulberry32(dateSeed()); }

/* ---------------- SHARE LINK ---------------- */
function encodeChallenge(obj){
  const json = JSON.stringify(obj);
  return btoa(encodeURIComponent(json).replace(/%([0-9A-F]{2})/g, (_, p) => String.fromCharCode('0x' + p)));
}
function decodeChallenge(str){
  const json = decodeURIComponent(
    Array.prototype.map.call(atob(str), c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')
  );
  return JSON.parse(json);
}
function buildShareUrl(payload){
  const url = new URL(window.location.href);
  url.search = '';
  url.searchParams.set('r', encodeChallenge(payload));
  return url.toString();
}

let incomingChallenge = null;
let challengeDismissed = false;
try{
  const params = new URLSearchParams(window.location.search);
  if(params.has('r')){
    incomingChallenge = decodeChallenge(params.get('r'));
  }
}catch(err){
  incomingChallenge = null;
}

/* ---------------- INTRO ---------------- */
function renderIntro(){
  currentTestIndex = -1;
  renderProgress();

  if(incomingChallenge && !challengeDismissed){
    const c = incomingChallenge;
    app.innerHTML = `
      <div class="eyebrow">Tages-Challenge · ${c.date || todayLabel}</div>
      <h1 class="display" style="font-size:24px;">HERAUSGEFORDERT</h1>
      <p class="sub">Jemand hat heute <strong>${c.overall}/100</strong> erreicht — Diagnose: „${c.diag}“. Schaffst du mehr?</p>
      <div class="challenge-stats">
        <div class="row"><span>REAKTION</span><span>${c.r}ms</span></div>
        <div class="row"><span>TIMING</span><span>${c.t}%</span></div>
        <div class="row"><span>GEDÄCHTNIS</span><span>${c.m}</span></div>
        <div class="row"><span>PRÄZISION</span><span>${c.p}%</span></div>
      </div>
      <button class="signal" id="startBtn">Challenge annehmen</button>
      <button class="ghost" id="skipBtn" style="margin-top:10px;">Eigene Runde starten</button>
    `;
    document.getElementById('startBtn').onclick = ()=>{ challengeDismissed = true; resetDailyRng(); nextTest(); };
    document.getElementById('skipBtn').onclick = ()=>{ challengeDismissed = true; renderIntro(); };
    return;
  }

  app.innerHTML = `
    <div class="eyebrow">Tages-Challenge · ${todayLabel}</div>
    <h1 class="display">REFLEX LAB</h1>
    <p class="sub">Wir testen Reaktion, Timing, Gedächtnis und Präzision. Heute haben alle die gleiche Challenge — am Ende bekommst du deinen Laborbericht.</p>
    <button class="signal" id="startBtn">Test starten</button>
  `;
  document.getElementById('startBtn').onclick = ()=>{ resetDailyRng(); nextTest(); };
}

function nextTest(){
  currentTestIndex++;
  if(currentTestIndex >= TESTS.length){
    renderResult();
    return;
  }
  renderProgress();
  const test = TESTS[currentTestIndex];
  if(test === 'reaction') renderReaction();
  if(test === 'timing') renderTiming();
  if(test === 'memory') renderMemory();
  if(test === 'precision') renderPrecision();
}

/* ---------------- TEST 1: REACTION ---------------- */
const REACTION_COLORS = [
  { name: 'GRÜN',  hex: '#C9E4B8' },
  { name: 'BLAU',  hex: '#BFD7EA' },
  { name: 'GELB',  hex: '#F5DE8C' },
  { name: 'LILA',  hex: '#D9C6E8' },
  { name: 'ORANGE', hex: '#F2C29A' },
  { name: 'TÜRKIS', hex: '#B6E0DA' },
];

function renderReaction(){
  const target = REACTION_COLORS[Math.floor(rng() * REACTION_COLORS.length)];

  app.innerHTML = `
    <div class="reaction-zone wait" id="rzone">
      <div class="reaction-word" id="rword">WARTEN...</div>
      <div class="reaction-hint">Tippe erst wenn's <strong>${target.name}</strong> wird</div>
    </div>
  `;
  const zone = document.getElementById('rzone');
  const word = document.getElementById('rword');
  let state = 'wait';
  let goTime = 0;
  const delay = 1000 + rng() * 2200;

  const timer = setTimeout(()=>{
    state = 'go';
    zone.classList.remove('wait');
    zone.style.background = target.hex;
    word.textContent = 'JETZT!';
    goTime = performance.now();
  }, delay);

  zone.addEventListener('click', function handler(){
    if(state === 'wait'){
      clearTimeout(timer);
      zone.className = 'reaction-zone early';
      zone.style.background = '';
      word.textContent = 'ZU FRÜH';
      zone.removeEventListener('click', handler);
      setTimeout(renderReaction, 900);
      return;
    }
    if(state === 'go'){
      const ms = Math.round(performance.now() - goTime);
      scores.reaction = { ms, score: Math.round(mapRange(ms, 180, 550, 100, 20)) };
      zone.removeEventListener('click', handler);
      nextTest();
    }
  });
}

/* ---------------- TEST 2: TIMING ---------------- */
function renderTiming(){
  const isMobile = window.matchMedia('(max-width: 480px)').matches;
  app.innerHTML = `
    <div class="eyebrow">Test 2 / 4</div>
    <h1 class="display" style="font-size:22px;">TIMING</h1>
    <p class="sub">${isMobile ? 'Tippe irgendwo auf den Screen, wenn die Nadel in der Zielzone ist.' : 'Stoppe die Nadel in der Zielzone.'}</p>
    <div class="timing-track">
      <div class="timing-target"></div>
      <div class="timing-needle" id="needle"></div>
    </div>
    ${isMobile ? '' : '<button class="ghost" id="stopBtn">STOPPEN</button>'}
  `;
  const track = document.querySelector('.timing-track');
  const needle = document.getElementById('needle');
  const trackWidth = track.offsetWidth;
  let pos = 0;
  let dir = 1;
  const speed = 4.2;
  let running = true;

  function tick(){
    if(!running) return;
    pos += dir * speed;
    if(pos >= trackWidth - 4){ pos = trackWidth - 4; dir = -1; }
    if(pos <= 0){ pos = 0; dir = 1; }
    needle.style.left = pos + 'px';
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function stop(){
    if(!running) return;
    running = false;
    const center = trackWidth * 0.5;
    const dist = Math.abs(pos - center);
    const accuracy = Math.round(mapRange(dist, 0, trackWidth * 0.5, 100, 0));
    scores.timing = { accuracy, score: accuracy };
    nextTest();
  }

  if(isMobile){
    setTimeout(()=> app.addEventListener('click', stop), 0);
  } else {
    document.getElementById('stopBtn').onclick = stop;
  }
}

/* ---------------- TEST 3: MEMORY ---------------- */
function renderMemory(){
  app.innerHTML = `
    <div class="eyebrow">Test 3 / 4</div>
    <h1 class="display" style="font-size:22px;">GEDÄCHTNIS</h1>
    <p class="sub" id="memSub">Merk dir die Reihenfolge...</p>
    <div class="memory-grid" id="grid"></div>
  `;
  const grid = document.getElementById('grid');
  const sub = document.getElementById('memSub');
  const tiles = [];
  for(let i=0;i<9;i++){
    const t = document.createElement('div');
    t.className = 'memory-tile';
    t.dataset.idx = i;
    grid.appendChild(t);
    tiles.push(t);
  }
  const sequence = [];
  while(sequence.length < 4){
    const idx = Math.floor(rng()*9);
    if(!sequence.includes(idx)) sequence.push(idx);
  }

  let i = 0;
  function flashNext(){
    if(i >= sequence.length){
      sub.textContent = 'Jetzt du: tippe die Reihenfolge nach';
      enableInput();
      return;
    }
    const tile = tiles[sequence[i]];
    tile.classList.add('flash');
    setTimeout(()=>{
      tile.classList.remove('flash');
      i++;
      setTimeout(flashNext, 250);
    }, 500);
  }
  setTimeout(flashNext, 600);

  function enableInput(){
    let userSeq = [];
    tiles.forEach(t=>{
      t.onclick = ()=>{
        if(userSeq.length >= sequence.length) return;
        t.classList.add('picked');
        userSeq.push(Number(t.dataset.idx));
        if(userSeq.length === sequence.length){
          let correct = 0;
          userSeq.forEach((v,idx)=>{ if(v === sequence[idx]) correct++; });
          scores.memory = { correct, total: sequence.length, score: Math.round((correct/sequence.length)*100) };
          setTimeout(nextTest, 400);
        }
      };
    });
  }
}

/* ---------------- TEST 4: PRECISION ---------------- */
function renderPrecision(){
  app.innerHTML = `
    <div class="eyebrow">Test 4 / 4</div>
    <h1 class="display" style="font-size:22px;">PRÄZISION</h1>
    <p class="sub">Triff die Mitte der 3 Ziele.</p>
    <div class="precision-field" id="field"></div>
  `;
  const field = document.getElementById('field');
  const fieldRect = () => field.getBoundingClientRect();
  let round = 0;
  const results = [];
  const SIZE_START = window.matchMedia('(max-width: 480px)').matches ? 280 : 70;

  function spawnTarget(){
    const size = SIZE_START;
    const rect = fieldRect();
    const maxX = rect.width - size - 10;
    const maxY = rect.height - size - 10;
    const x = 10 + rng() * Math.max(maxX, 10);
    const y = 10 + rng() * Math.max(maxY, 10);

    const target = document.createElement('div');
    target.className = 'precision-target';
    target.style.width = size + 'px';
    target.style.height = size + 'px';
    target.style.left = x + 'px';
    target.style.top = y + 'px';
    target.style.transition = 'width 1.1s linear, height 1.1s linear, left 1.1s linear, top 1.1s linear';
    field.appendChild(target);

    requestAnimationFrame(()=>{
      const shrink = size * 0.35;
      target.style.width = shrink + 'px';
      target.style.height = shrink + 'px';
      target.style.left = (x + (size-shrink)/2) + 'px';
      target.style.top = (y + (size-shrink)/2) + 'px';
    });

    let clicked = false;
    const timeout = setTimeout(()=>{
      if(clicked) return;
      clicked = true;
      results.push(0);
      target.remove();
      advance();
    }, 1150);

    target.onclick = (e)=>{
      if(clicked) return;
      clicked = true;
      clearTimeout(timeout);
      const tRect = target.getBoundingClientRect();
      const cx = tRect.left + tRect.width/2;
      const cy = tRect.top + tRect.height/2;
      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const acc = Math.round(mapRange(dist, 0, tRect.width, 100, 0));
      results.push(clamp(acc,0,100));
      target.remove();
      advance();
    };
  }

  function advance(){
    round++;
    if(round >= 3){
      const avg = Math.round(results.reduce((a,b)=>a+b,0)/results.length);
      scores.precision = { score: avg };
      nextTest();
    } else {
      setTimeout(spawnTarget, 250);
    }
  }
  spawnTarget();
}

function diagnosisFor(score){
  const pick = (arr) => arr[Math.floor(rng() * arr.length)];
  if(score >= 90) return pick(DIAGNOSES.s90);
  if(score >= 75) return pick(DIAGNOSES.s75);
  if(score >= 55) return pick(DIAGNOSES.s55);
  if(score >= 35) return pick(DIAGNOSES.s35);
  return pick(DIAGNOSES.s0);
}

  );

}

/* ---------------- SHARE CARD (Canvas) ---------------- */
function buildCardCanvas(data){
  const { overall, diag, r, t, m, p } = data;
  const W = 640, H = 900;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // paper background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  // subtle top strip
  ctx.fillStyle = '#EDF1EC';
  ctx.fillRect(0, 0, W, 64);

  const centerX = W / 2;
  ctx.textAlign = 'center';

  ctx.fillStyle = '#4A5A55';
  ctx.font = '700 15px "Space Mono", monospace';
  ctx.fillText('REFLEX LAB · TAGES-CHALLENGE', centerX, 40);

  ctx.fillStyle = '#16221F';
  ctx.font = '700 17px "Space Mono", monospace';
  ctx.fillText(new Date().toLocaleDateString('de-DE'), centerX, 105);

  dashedLine(ctx, 40, 130, W - 40, 130);

  ctx.fillStyle = '#E2412C';
  ctx.font = '700 24px Inter, sans-serif';
  ctx.fillText(diag.title, centerX, 180);

  ctx.fillStyle = '#16221F';
  ctx.font = '900 130px "Archivo Black", sans-serif';
  ctx.fillText(String(overall), centerX, 320);

  ctx.fillStyle = '#4A5A55';
  ctx.font = '400 15px Inter, sans-serif';
  ctx.fillText(diag.note, centerX, 360);

  dashedLine(ctx, 40, 400, W - 40, 400);

  const rows = [
    ['REAKTION', r.ms + 'ms'],
    ['TIMING', t.accuracy + '%'],
    ['GEDÄCHTNIS', m.correct + '/' + m.total],
    ['PRÄZISION', p.score + '%'],
  ];
  ctx.font = '700 20px "Space Mono", monospace';
  let y = 445;
  rows.forEach(([label, val])=>{
    ctx.textAlign = 'left';
    ctx.fillStyle = '#4A5A55';
    ctx.fillText(label, 60, y);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#16221F';
    ctx.fillText(val, W - 60, y);
    y += 42;
  });

  dashedLine(ctx, 40, y + 10, W - 40, y + 10);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#4A5A55';
  ctx.font = '400 13px "Space Mono", monospace';
  ctx.fillText('ENDE DER PRÜFUNG', centerX, y + 45);

  ctx.fillStyle = '#16221F';
  ctx.font = '700 16px Inter, sans-serif';
  ctx.fillText('Schlag das Ergebnis 👉', centerX, H - 60);

  // torn edge effect at bottom
  ctx.fillStyle = '#EDF1EC';
  const teeth = 20;
  const toothWidth = W / teeth;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for(let i = 0; i <= teeth; i++){
    const x = i * toothWidth;
    ctx.lineTo(x, H - (i % 2 === 0 ? 14 : 0));
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();

  return canvas;
}

function dashedLine(ctx, x1, y, x2, y2){
  ctx.save();
  ctx.strokeStyle = '#c9c9c9';
  ctx.setLineDash([6, 5]);
  ctx.beginPath();
  ctx.moveTo(x1, y);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.restore();
}

async function shareCard(data){
  showToast('Karte wird erstellt...');
  // give fonts a beat to be ready
  if(document.fonts && document.fonts.ready){ await document.fonts.ready; }
  const canvas = buildCardCanvas(data);

  canvas.toBlob(async (blob)=>{
    if(!blob){ showToast('Karte konnte nicht erstellt werden'); return; }
    const file = new File([blob], 'reflex-lab-ergebnis.png', { type: 'image/png' });

    if(navigator.canShare && navigator.canShare({ files: [file] })){
      try{
        await navigator.share({
          files: [file],
          title: 'Reflex Lab Ergebnis',
          text: data.shareText,
        });
        return;
      }catch(err){
        // user cancelled or share failed — fall through to download
      }
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'reflex-lab-ergebnis.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Karte heruntergeladen ✓');
  }, 'image/png');
}

renderIntro();
