<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>REFLEX LAB — Datenschutz</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C2523">
<link rel="icon" href="icons/icon-32.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="styles.css">
<style>
  .impressum-inner{
    flex:1;
    display:flex;
    flex-direction: column;
    padding: 32px 24px;
    text-align:left;
    height: 100%;
    width: 100%;
    overflow: hidden;
  }
  .back-link{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    text-decoration: underline;
    text-underline-offset: 2px;
    align-self: flex-start;
  }
  .back-links{
    display:flex;
    gap: 14px;
    margin-bottom: 18px;
  }
  .impressum-title{
    font-family: var(--font-display);
    font-size: 24px;
    margin: 0 0 20px;
  }
  .impressum-body{
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 22px;
    padding-right: 4px;
  }
  .impressum-heading{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--signal);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .impressum-subheading{
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    margin: 12px 0 4px;
  }
  .impressum-text{
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink-soft);
  }
  canvas.impressum-canvas{
    display: block;
    max-width: 100%;
    height: auto;
  }
  .impressum-footnote{
    font-size: 11px;
    color: var(--ink-soft);
    font-style: italic;
    margin-top: 4px;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="device">
    <div id="device-header">
      <div id="device-label">REFLEX LAB · MODELL RX-4</div>
      <div id="device-dot"></div>
    </div>
    <div id="screen">
      <div class="impressum-inner" id="app"></div>
    </div>
  </div>
</div>

<script>
const app = document.getElementById('app');
app.innerHTML = `
  <div class="back-links">
    <a class="back-link" href="index.html">← Zurück</a>
    <a class="back-link" href="impressum.html">Impressum</a>
  </div>
  <h1 class="impressum-title">DATENSCHUTZ</h1>
  <div class="impressum-body">
    <div>
      <div class="impressum-heading">Verantwortlicher</div>
      <canvas class="impressum-canvas" id="ownerCanvas"></canvas>
      <p class="impressum-text" style="margin-top:6px;">Vollständige Angaben siehe <a href="impressum.html" style="color:var(--ink-soft);">Impressum</a>.</p>
    </div>

    <div>
      <div class="impressum-heading">Hosting</div>
      <p class="impressum-text">Diese Seite wird bei Vercel Inc. gehostet. Beim Aufruf der Seite verarbeitet Vercel automatisch technische Zugriffsdaten (u.a. IP-Adresse, Datum/Uhrzeit, aufgerufene Seite, Browsertyp) in Server-Logfiles, um die Seite technisch auszuliefern und die Betriebssicherheit zu gewährleisten. Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO (berechtigtes Interesse an einer sicheren und funktionsfähigen Bereitstellung).</p>
    </div>

    <div>
      <div class="impressum-heading">Schriftarten</div>
      <p class="impressum-text">Alle Schriftarten sind lokal auf diesem Server eingebunden. Es findet keine Verbindung zu Google Fonts oder anderen externen Schriftarten-Diensten statt — beim Aufruf dieser Seite werden also keine Daten an Dritte zu diesem Zweck übertragen.</p>
    </div>

    <div>
      <div class="impressum-heading">Lokale Speicherung</div>
      <p class="impressum-text">Deine gewählte Schwierigkeitsstufe (Leicht/Normal/Schwer) wird ausschließlich lokal in deinem Browser gespeichert (<code>localStorage</code>), damit sie beim nächsten Besuch erhalten bleibt. Diese Information verlässt niemals dein Gerät und wird nicht an uns oder Dritte übertragen.</p>
    </div>

    <div>
      <div class="impressum-heading">Cookies &amp; Tracking</div>
      <p class="impressum-text">Diese Seite setzt keine Cookies und verwendet keine Analyse- oder Tracking-Tools (z.B. Google Analytics). Es findet keine Erstellung von Nutzungsprofilen statt.</p>
    </div>

    <div>
      <div class="impressum-heading">Tages-Challenge &amp; Teilen-Funktion</div>
      <p class="impressum-text">Dein Testergebnis kann über einen Link oder ein Bild geteilt werden. Dabei werden ausschließlich Spielwerte (Punktzahl, Schwierigkeit, Diagnose-Text) in den Link bzw. das Bild eingebettet — keine personenbezogenen Daten. Das Teilen erfolgt aktiv durch dich, z.B. über die Teilen-Funktion deines Geräts.</p>
    </div>

    <div>
      <div class="impressum-heading">Bestenliste (Leaderboard)</div>
      <p class="impressum-text">Die Tages-Bestenliste (Top 10 für deine Schwierigkeit) wird automatisch geladen und angezeigt, sobald du eine Runde abschließt — dabei werden keine Daten von dir übertragen, nur öffentliche Einträge anderer gelesen. Erst wenn du aktiv auf „Eintragen“ klickst, wird dein Ergebnis (Gesamtscore, Einzelwerte, Schwierigkeit, Datum sowie ein optionaler, frei wählbarer Spitzname) an unsere Datenbank bei Supabase übertragen und selbst Teil der öffentlichen Bestenliste. Supabase verarbeitet dabei technisch bedingt auch deine IP-Adresse. Der Serverstandort liegt in der EU (Frankfurt, eu-central-1). Es ist kein Konto oder Login nötig. Rechtsgrundlage ist Art. 6 Abs. 1 lit. a DSGVO (Einwilligung durch aktives Klicken auf „Eintragen“). Der Spitzname wird zusätzlich lokal in deinem Browser gespeichert (<code>localStorage</code>), damit du ihn nicht jedes Mal neu eingeben musst. Bestenlisten-Einträge werden automatisiert nach 30 Tagen gelöscht; einmal übermittelte Einträge können vor Ablauf dieser Frist aus technischen Gründen nicht von dir selbst gelöscht oder geändert werden — wende dich dafür an die im Impressum genannte Kontaktadresse.</p>
    </div>

    <div>
      <div class="impressum-heading">Deine Rechte</div>
      <p class="impressum-text">Du hast das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung, Datenübertragbarkeit sowie Widerspruch gegen die Verarbeitung deiner personenbezogenen Daten. Wende dich dazu an die im Impressum genannte Kontaktadresse. Außerdem besteht ein Beschwerderecht bei einer Datenschutz-Aufsichtsbehörde.</p>
    </div>

    <p class="impressum-footnote">Hinweis: Diese Datenschutzerklärung ist eine allgemeine Orientierung für ein privates Hobby-Projekt und keine Rechtsberatung.</p>
  </div>
`;

function decodeLine(b64){
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

function renderTextCanvas(canvasId, encodedLines){
  const lines = encodedLines.map(decodeLine);
  const canvas = document.getElementById(canvasId);
  const scale = window.devicePixelRatio || 1;
  const lineHeight = 22;
  const fontSize = 14;
  const width = 320;
  const height = lines.length * lineHeight + 16;

  canvas.width = width * scale;
  canvas.height = height * scale;
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';

  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  ctx.textBaseline = 'top';
  ctx.font = `400 ${fontSize}px "Space Mono", monospace`;
  ctx.fillStyle = '#16221F';

  lines.forEach((line, i) => {
    ctx.fillText(line, 0, 8 + i * lineHeight);
  });
}

const OWNER_LINES = ['Sm9uYXRoYW4gUml2ZXJh', 'TWFpbmF1c3RyLiA0MQ==', 'ODEyNDMgTcO8bmNoZW4='];

if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(()=>{
    renderTextCanvas('ownerCanvas', OWNER_LINES);
  });
} else {
  renderTextCanvas('ownerCanvas', OWNER_LINES);
}
</script>
</body>
</html>
